name: Construir para Mac

# Se ejecuta a mano (Actions > Construir para Mac > Run workflow)
# y también cuando publicas una versión nueva en GitHub.
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Guardar el instalador como archivo descargable
        uses: actions/upload-artifact@v4
        with:
          name: perrito-mac
          path: |
            dist/*.dmg
            dist/*.zip
      - name: Agregar el instalador a la versión de GitHub
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.dmg --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
