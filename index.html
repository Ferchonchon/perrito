<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'">
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; user-select: none; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="300" height="290"></canvas>
<script src="sprites/chispa/sprites.js"></script>
<script src="sprites/pimienta/sprites.js"></script>
<script>
// =====================================================================
// 1) CONFIGURACIÓN (las dos "perillas" para ajustar su ritmo)
// =====================================================================
const VELOCIDAD = 0.5;           // qué tan rápido camina (1 = rápido, 0.3 = muy tranquilo)
const CALMA = 1;                 // cuánto dura cada actividad (2 = el doble de tiempo)
const seg = n => n * 60 * CALMA; // segundos -> pasos del ciclo
const TAM = () => Math.max(0.5, Math.min(1, Number(config.tamano) || 1));   // tamaño elegido en Ajustes

const W = 300, H = 290, OX = 80, OY = 170, G = 1.2;
const params = new URLSearchParams(location.search);
const ID = params.get('id') || 'chispa';
const RAZA = params.get('raza') || 'labrador';
const PRINCIPAL = ID === 'chispa';
const canvas = document.getElementById('c');
let ctx = canvas.getContext('2d');

const COLORES = {
  labrador:  { pelo: '#1c1c1c', borde: '#4a4a4a', pecho: '#9a5a2b', oreja: '#111111', patas: '#1c1c1c', ojo: '#3b2412' },
  schnauzer: { pelo: '#7b7b7b', borde: '#3d3d3d', pecho: '#cfcfcf', oreja: '#555555', patas: '#bdbdbd', ojo: '#1a1a1a',
               claro: '#dcdcdc', manchas: '#5e5e5e' }
};
const C = COLORES[RAZA];
const COMUN = { lengua: '#ff7a8a', lenguaBorde: '#d95c6c', z: '#5b6cff', corazon: '#ff4d6d' };

// =====================================================================
// 2) ESTADO
// =====================================================================
let displays = [], repisas = [], otros = [];
let config = { sonido: true, nombre: 'Chispa', nombreAmigo: 'Pimienta', inactividadMin: 2, accesorio: 'auto' };
let x = 0, y = 0, dir = 1;
let estado = 'caminar', tiempo = seg(5), frame = 0;
let vy = 0, vxAire = 0, soloPiso = false;
let animo = 70, ultimoBajon = Date.now();
let hambre = 20, ultimoPedido = 0;
let corazones = [], bocadillo = null, cajaBocadillo = null;
let pomodoro = null, clima = null;
let cursor = { x: -9999, y: -9999 }, cursorAntes = null, cursorMovidoHasta = 0, ignorarCursorHasta = 0;
let idle = 0, dormidoPorInactividad = false, escribiendo = 0, ultimoComentarioTeclado = 0;
let pelota = null, tienePelota = false, esperandoPelota = false;
let plato = null, yaComio = false, esperandoComida = false;
let objetivoRepisa = null;
let ultimaSubida = Date.now() - 2 * 60e3;
let ignorarPelotaHasta = 0, descansoPelota = 0, juegoPropio = false;   // jugar con la pelota por su cuenta
let ultimoBostezo = 0;
let mariposa = null, ultimaMariposa = 0, ultimoTropiezo = 0, ultimaAlerta = 0;
let regaloEnBoca = null, ultimoRegalo = Date.now(), orillaRegalo = 0;
let sed = 20, suciedad = 10, desalino = 10, peso = 0, necesidad = false;
let cumple = false, cumpleAmiga = false, favorito = null;
let agua = null, cama = null, laser = null, charco = null;
let esperandoAgua = false, yaBebio = 0, enCama = false;
let paseo = null, siguiendoA = null, cuerdaJuego = null, escondite = null;
let anclaX = 0, olfateo = 0;
let espuma = [], frotado = 0, gotas = [], brillos = [], confeti = [];
let cepillado = 0, ultimoCepillado = 0, ultimoMouse = null;
let opacidad = 1, ultimoAvisoSed = 0, ultimoAvisoSucia = 0, ultimoFavorito = 0;
let particulas = [], fantasma = null, dijoCumple = false;
let arrastre = null, ignorando = true, clicPendiente = null;

const trabajando = () => pomodoro && pomodoro.fase === 'trabajo';
const centroX = () => x + OX + 70;
const pies = () => y + H - 3;
const hora = () => new Date().getHours();
const esNoche = () => hora() >= 22 || hora() < 7;
const llueve = () => clima && clima.lluvia;
const haceFrio = () => clima && clima.temp < 14;
const haceCalor = () => clima && clima.temp > 30;
const azar = arr => arr[Math.floor(Math.random() * arr.length)];
const miNombre = () => PRINCIPAL ? config.nombre : config.nombreAmigo;

let ultimaVuelta = 0, dirVis = 1, giroT = 0;
function voltear(nuevo, forzar = false) {
  if (nuevo === dir) return;
  if (!forzar && Date.now() - ultimaVuelta < 2000) return;
  dir = nuevo; ultimaVuelta = Date.now();
}
function cambiar(e, dur) { estado = e; tiempo = dur; }
function decir(texto, ms = 5000, fijo = false, accion = null) {
  if (bocadillo && bocadillo.fijo && !fijo) return;     // no tapa un aviso importante que no has cerrado
  bocadillo = { texto, hasta: fijo ? Infinity : Date.now() + ms, fijo, accion };
}
const ocupada = () => ['aire', 'arrastrado', 'bano', 'sacudirse', 'salir', 'afuera', 'ir_por_regalo', 'afuera_regalo', 'traer_regalo'].includes(estado);
function lanzarCorazones(n = 3) {
  for (let i = 0; i < n; i++) corazones.push({ x: OX + 50 + Math.random() * 50, y: OY + 40, vida: 60 + i * 10 });
}
function brincar(fuerza = 8) { estado = 'aire'; vy = -fuerza; vxAire = 0; }

// =====================================================================
// 3) SUELO: pantallas y repisas (bordes de ventanas abiertas)
// =====================================================================
function pantallaEn(px, py = pies()) {
  const candidatas = displays.filter(d => px >= d.x && px < d.x + d.width);
  if (!candidatas.length) return null;
  let mejor = null, mejorDist = Infinity;
  for (const d of candidatas) {
    const dist = py < d.y ? d.y - py : py > d.y + d.height ? py - (d.y + d.height) : 0;
    if (dist < mejorDist) { mejor = d; mejorDist = dist; }
  }
  return mejor;
}
function pantallaMasCercana(px) {
  return displays.reduce((m, d) => !m || Math.abs(d.x + d.width / 2 - px) < Math.abs(m.x + m.width / 2 - px) ? d : m, null);
}
function superficies() {
  const s = displays.map(d => ({ x1: d.x, x2: d.x + d.width, y: d.y + d.height, piso: true }));
  if (!soloPiso) for (const r of repisas) s.push(r);
  return s;
}
function sueloActual(py = pies()) {             // la superficie más alta que esté debajo de sus patas
  const px = centroX();
  let mejor = null;
  for (const s of superficies()) {
    if (px >= s.x1 && px < s.x2 && s.y >= py - 8 && (!mejor || s.y < mejor.y)) mejor = s;
  }
  if (!mejor) {                                 // quedó fuera de las pantallas: lo regresamos
    const d = pantallaMasCercana(px);
    x = Math.min(Math.max(x, d.x - OX - 60), d.x + d.width - OX - 80);
    mejor = { y: d.y + d.height, piso: true };
  }
  return mejor;
}
const enRepisa = () => !sueloActual().piso;
function bajarAlPiso() { soloPiso = true; estado = 'aire'; vy = -4; vxAire = 1.5 * dir; }

// =====================================================================
// 4) SONIDO: ladrido sintetizado (el schnauzer ladra más agudo)
// =====================================================================
let audio = null;
function ladrar(veces = 2, forzar = false) {
  if (!config.sonido || (trabajando() && !forzar)) return;
  try {
    audio = audio || new AudioContext();
    const tono = RAZA === 'schnauzer' ? 1.35 : 1;
    for (let i = 0; i < veces; i++) {
      const t = audio.currentTime + i * 0.22;
      const o = audio.createOscillator(), g = audio.createGain(), f = audio.createBiquadFilter();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(520 * tono, t);
      o.frequency.exponentialRampToValueAtTime(220 * tono, t + 0.13);
      f.type = 'bandpass'; f.frequency.value = 900 * tono; f.Q.value = 1.2;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.35, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
      o.connect(f).connect(g).connect(audio.destination);
      o.start(t); o.stop(t + 0.18);
    }
  } catch (e) { /* sin audio */ }
}

// =====================================================================
// 4b) ACCIONES que le pides desde el menú o el chat
// =====================================================================
let galletaPorTruco = false, salidaOrilla = 0;
const desfaseCuerda = () => {                                           // las dos se mueven juntas (la cuerda no se estira)
  if (!cuerdaJuego) return 0;
  const t = (Date.now() - cuerdaJuego.inicio) / 1000;
  const jalones = 9 * Math.sin(t * 2.6) + 4 * Math.sin(t * 6.1);
  const final = Math.max(0, Math.min(1, 1 - (cuerdaJuego.fin - Date.now()) / 3000));   // últimos 3 s: gana una
  const gane = cuerdaJuego.ganadora === ID;
  return jalones + final * 30 * (gane ? -cuerdaJuego.lado : cuerdaJuego.lado);         // hacia el lado de la ganadora
};

function prepararAccion() { dormidoPorInactividad = false; enCama = false; if (tienePelota) soltarPelota(false); }
function hacerTruco(cual) {
  if (ocupada() || trabajando()) return;
  prepararAccion();
  window.mascota.evento({ tipo: 'truco' });
  galletaPorTruco = true;
  switch (cual) {
    case 'sentarse': cambiar('sentado', seg(3)); decir('¡Sentada! 🐶', 2000); break;
    case 'pata':     cambiar('pata', seg(3.5)); decir('¡Choca esa pata! 🐾', 2000); break;
    case 'muertita': cambiar('muertita', seg(4)); decir('*bang* 💥', 1500); break;
    case 'girar':    cambiar('cola', seg(2)); break;
    case 'saltar':   brincar(14); lanzarCorazones(2); break;
    case 'hablar':   ladrar(2, true); decir('¡Guau guau!', 2000); cambiar('sentado', seg(2.5)); break;
    case 'rodar':    cambiar('rodar', seg(1.75)); break;
  }
}
function pedirGalleta() {
  galletaPorTruco = false;
  decir('¿Y mi galletita? 🍪', 8000, false, 'galleta');
  return cambiar('sentado', seg(6));
}
function darGalleta() {
  if (ocupada()) return;
  prepararAccion();
  if (bocadillo && bocadillo.accion === 'galleta') bocadillo = null;
  galletaPorTruco = false;
  window.mascota.evento({ tipo: 'galleta' });
  peso += 5; animo = Math.min(100, animo + 6); lanzarCorazones(3);
  cambiar('comer_galleta', seg(2.5));
}
function darHueso() {
  if (ocupada()) return;
  prepararAccion();
  window.mascota.evento({ tipo: 'hueso' });
  decir('¡Un huesito! 🦴', 2000);
  cambiar('roer', seg(25));
}
function empezarBano() {
  if (ocupada() || trabajando()) return;
  prepararAccion();
  espuma = []; frotado = 0;
  cambiar('bano', seg(90));
  decir('Pásame el mouse encima para tallarme 🧼', 4000);
}
function enjuagar() {
  espuma = [];
  for (let i = 0; i < 40; i++) gotas.push({ x: OX + 30 + Math.random() * 100, y: OY + Math.random() * 40, vx: 0, vy: 2 + Math.random() * 2 });
  cambiar('sacudirse', seg(1.6));
}
function salirAlBano() {
  if (ocupada()) return;
  prepararAccion();
  if (bocadillo && bocadillo.accion === 'salir') bocadillo = null;
  const d = pantallaEn(centroX()) || displays[0];
  salidaOrilla = centroX() - d.x < d.x + d.width - centroX() ? d.x + 40 : d.x + d.width - 40;
  cambiar('salir', seg(25));
}
function accidente() {
  if (bocadillo && bocadillo.accion === 'salir') bocadillo = null;
  window.mascota.evento({ tipo: 'accidente', x: centroX() - dir * 40 });
  necesidad = false; animo = Math.max(0, animo - 10);
  decir('Ups… no aguanté 😅', 4000);
  return cambiar('triste', seg(8));
}
function empezarMariposa() {
  ultimaMariposa = Date.now();
  mariposa = { x: centroX() + dir * 150, y: pies() - 115, t: Math.random() * 10, huye: false,
               color: azar([['#ff9f1c', '#1b1b1b'], ['#5bc0eb', '#1d3557'], ['#f7d046', '#5a3d0c']]) };
  decir(azar(['¡Una mariposa! 🦋', '¡Mira! 🦋']), 2000);
  return cambiar('cazar_mariposa', seg(12));
}
function moverMariposa() {
  if (!mariposa) return;
  mariposa.t += 1 / 60;
  if (estado !== 'cazar_mariposa' && estado !== 'aire') mariposa.huye = true;   // si se distrae, la mariposa se va
  if (mariposa.huye) { mariposa.y -= 1.6; mariposa.x += Math.sin(mariposa.t * 3) * 1.5; if (mariposa.y < y + 5) mariposa = null; return; }
  const meta = centroX() + dir * (135 + 25 * Math.sin(mariposa.t * 0.8));        // revolotea adelante de su nariz
  mariposa.x += (meta - mariposa.x) * 0.035 + Math.sin(mariposa.t * 4.3) * 0.9;
  mariposa.y = pies() - 115 + Math.sin(mariposa.t * 2.1) * 14 + Math.sin(mariposa.t * 6.7) * 4;
}
function dibujarMariposa() {
  if (!mariposa) return;
  const mx = mariposa.x - x, my = mariposa.y - y, ab = Math.abs(Math.sin(mariposa.t * 14));
  const [c1, c2] = mariposa.color;
  ctx.save(); ctx.translate(mx, my);
  [-1, 1].forEach(l => {
    ctx.save(); ctx.scale(l * (0.25 + ab * 0.75), 1);
    ctx.beginPath(); ctx.ellipse(6, -4, 7, 5.5, -0.5, 0, Math.PI * 2); ctx.fillStyle = c1; ctx.fill(); ctx.strokeStyle = c2; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(5, 4, 4.5, 3.5, 0.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(9, -6, 1, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  });
  ctx.fillStyle = c2; ctx.beginPath(); ctx.ellipse(0, 0, 1.4, 5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = c2; ctx.lineWidth = 0.8; ctx.beginPath(); ctx.moveTo(0, -5); ctx.lineTo(-3, -9); ctx.moveTo(0, -5); ctx.lineTo(3, -9); ctx.stroke();
  ctx.restore();
}
function irPorRegalo() {
  ultimoRegalo = Date.now();
  if (enRepisa()) return bajarAlPiso();
  const d = pantallaEn(centroX()) || displays[0];
  orillaRegalo = centroX() - d.x < d.x + d.width - centroX() ? d.x + 40 : d.x + d.width - 40;
  return cambiar('ir_por_regalo', seg(30));
}
// El regalito en el hocico (mismas figuras que en el piso, en chiquito)
function dibujarRegaloBoca(item) {
  if (item === 'hoja') {
    ctx.save(); ctx.rotate(-0.3);
    ctx.beginPath(); ctx.moveTo(-9, 0); ctx.quadraticCurveTo(-1, -7, 9, 0); ctx.quadraticCurveTo(-1, 7, -9, 0);
    ctx.fillStyle = '#e07b2b'; ctx.fill(); ctx.strokeStyle = '#7a3410'; ctx.lineWidth = 1; ctx.stroke(); ctx.restore();
  } else if (item === 'palito') {
    ctx.save(); ctx.lineCap = 'round';
    ctx.strokeStyle = '#5a3a1c'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(-12, 1); ctx.lineTo(13, -1); ctx.stroke();
    ctx.strokeStyle = '#8b5e34'; ctx.lineWidth = 3.4; ctx.beginPath(); ctx.moveTo(-12, 1); ctx.lineTo(13, -1); ctx.stroke(); ctx.restore();
  } else {
    ctx.save(); ctx.strokeStyle = '#4a8a2a'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(-8, 2); ctx.lineTo(2, 0); ctx.stroke();
    for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3; ctx.beginPath(); ctx.ellipse(5 + Math.cos(a) * 3.6, Math.sin(a) * 3.6, 3, 1.9, a, 0, Math.PI * 2); ctx.fillStyle = '#ff8fb8'; ctx.fill(); }
    ctx.beginPath(); ctx.arc(5, 0, 2.2, 0, Math.PI * 2); ctx.fillStyle = '#ffd23f'; ctx.fill(); ctx.restore();
  }
}
function tropezar() {
  ultimoTropiezo = Date.now();
  if (tienePelota) soltarPelota(false);
  aplaste = 1;
  cambiar('tropiezo', seg(1.2));
}

function lanzarConfeti(n = 40) {
  const colores = ['#ff4d9d', '#ffd23f', '#5bc0eb', '#9bc53d', '#e55934'];
  for (let i = 0; i < n; i++) confeti.push({ x: OX + 70, y: OY + 30, vx: (Math.random() - 0.5) * 6, vy: -3 - Math.random() * 4, color: azar(colores), vida: 120 });
}

// =====================================================================
// 5) CEREBRO: qué hace cuando termina una actividad
// =====================================================================
function elegirEstado() {
  const terminado = estado;
  if (terminado !== 'dormir') enCama = false;
  if (terminado === 'afuera') {
    opacidad = 0.15; necesidad = false;
    window.mascota.evento({ tipo: 'salio' });
    decir('¡Listo! 😌 Gracias', 3000);
    return cambiar('sentado', seg(3));
  }
  if (terminado === 'salir') { opacidad = 1; return cambiar('sentado', seg(2)); }
  if (terminado === 'pedir_salir') return accidente();
  if (terminado === 'sacudirse') {
    suciedad = 0; window.mascota.evento({ tipo: 'banada' });
    for (let i = 0; i < 12; i++) brillos.push({ x: OX + 30 + Math.random() * 100, y: OY + 40 + Math.random() * 60, vida: 40 });
    decir(azar(['¡Limpiecita! ✨', '¡Huelo a rosas! 🌸', '¡Qué rico bañito! 🛁']), 3000);
    animo = Math.min(100, animo + 10);
    return cambiar('sentado', seg(4));
  }
  if (terminado === 'bano') { espuma = []; decir('Bueno… luego me bañas 🙈', 2500); return cambiar('sentado', seg(3)); }
  if (terminado === 'cazar_mariposa') {
    if (mariposa) mariposa.huye = true;
    decir(azar(['Casi la atrapo… 🦋', '¡Se escapó! 🦋', 'La próxima vez sí 😤']), 2500);
    return cambiar('sentado', seg(3));
  }
  if (terminado === 'alerta') return cambiar('sentado', seg(3));
  if (terminado === 'tropiezo') { decir(azar(['¡Uy! 😅', 'No pasó nada 😅', '¡Ups!']), 1800); return cambiar('sentado', seg(2)); }
  if (terminado === 'afuera_regalo') {                                 // vuelve con algo en la boca
    regaloEnBoca = azar(['hoja', 'palito', 'flor']);
    const d = pantallaEn(centroX()) || displays[0];
    voltear(orillaRegalo < d.x + d.width / 2 ? 1 : -1, true);
    return cambiar('traer_regalo', seg(30));
  }
  if (terminado === 'ir_por_regalo' || terminado === 'traer_regalo') { opacidad = 1; regaloEnBoca = null; return cambiar('sentado', seg(2)); }
  if (terminado === 'bostezar') return cambiar(Math.random() < 0.5 ? 'acurrucado' : 'sentado', seg(8));
  if (terminado === 'celebrar') return cambiar('sentado', seg(4));
  if (terminado === 'beber') { decir(azar(['¡Ahh, qué fresca! 💧', '*slurp slurp*']), 2500); return cambiar('sentado', seg(3)); }
  if (terminado === 'jalar') { cuerdaJuego = null; return cambiar('sentado', seg(3)); }
  if (terminado === 'escondida') {                                     // nadie la encontró
    escondite = null; window.mascota.evento({ tipo: 'encontrada' });
    decir('¡Gané, no me encontraste! 😜', 3000);
    return cambiar('sentado', seg(3));
  }
  if (terminado === 'esconderse' || terminado === 'buscar_amiga') escondite = null;
  if (terminado === 'ir_jalar') cuerdaJuego = null;
  if (galletaPorTruco && terminado !== 'aire') return pedirGalleta();
  if (['roer', 'comer_galleta', 'pata', 'muertita', 'rodar', 'celos', 'perseguir_laser', 'ir_cama', 'ir_beber',
       'escondida', 'esconderse', 'buscar_amiga', 'ir_jalar', 'seguir', 'pasear', 'pedir_salir_ir'].includes(terminado)) {
    return cambiar('sentado', seg(3));
  }
  if (trabajando()) return cambiar('dormir', seg(10));
  if (estado === 'dormir' || estado === 'acurrucado') return cambiar('estirar', seg(2.5));
  if (estado === 'comer') {
    animo = Math.min(100, animo + 15);
    decir(azar(['¡Qué rico! 😋', '¡Gracias! 🍖', '*lame el plato*']), 3000);
    return cambiar('sentado', seg(4));
  }

  // Si anda sobre una ventana, a veces se baja
  if (enRepisa() && Math.random() < 0.15) return bajarAlPiso();

  const amigo = otros[0];
  const candidatasRepisa = repisas.filter(r =>
    r.y < pies() - 50 && r.y > pies() - 620 && r.x2 - r.x1 > 140 &&
    Math.max(r.x1, centroX() - 400) < Math.min(r.x2, centroX() + 400));

  const opciones = (animo < 30 || hambre > 85)
    ? { triste: 5, dormir: 3, caminar: 2 }
    : {
        caminar: 6, sentado: 4,
        dormir: esNoche() ? 4 : 1,
        acurrucado: (llueve() || haceFrio()) ? 3 : 0,
        rascar: 0.5, estirar: 0.3,
        cola: animo > 80 ? 0.6 : 0.2,
        pelota: pelota && !pelota.portador && !pelota.lanzada && pelota.enSuelo && Date.now() > descansoPelota && Date.now() > (pelota.descansoHasta || 0) && animo > 40 ? 2.5 : 0,
        bostezo: config.reaccionesHora !== false && hora() >= 14 && hora() < 18 ? 1.2 : 0,
        mariposa: !esNoche() && !llueve() && !mariposa && Date.now() - ultimaMariposa > 10 * 60e3 ? 0.5 : 0,
        alerta: Date.now() - ultimaAlerta > 6 * 60e3 ? 0.35 : 0,
        regalo: !esNoche() && !llueve() && Date.now() - ultimoRegalo > 75 * 60e3 && !trabajando() ? 0.3 : 0,
        panza: haceCalor() ? 1.5 : animo > 60 ? 0.5 : 0.2,
        trepar: candidatasRepisa.length ? (enRepisa() ? 1 : 3) : 0,
        amigo: amigo ? 1 : 0
      };
  const total = Object.values(opciones).reduce((a, b) => a + b, 0);
  let r = Math.random() * total, elegido = 'caminar';
  for (const [k, p] of Object.entries(opciones)) { if ((r -= p) <= 0) { elegido = k; break; } }

  if (elegido === 'pelota') {                                         // la ve en el piso y va por ella
    if (enRepisa()) return bajarAlPiso();
    juegoPropio = true;
    return cambiar('buscar', seg(20));
  }
  if (elegido === 'mariposa') return empezarMariposa();
  if (elegido === 'alerta') {
    ultimaAlerta = Date.now();
    voltear(Math.random() < 0.5 ? 1 : -1, true);
    decir(azar(['¡Guau! ¿Qué fue eso? 👀', '¡Escuché algo! 👂', '¡Guau guau! 👀']), 2500);
    ladrar(2);
    return cambiar('alerta', seg(3.5));
  }
  if (elegido === 'regalo') return irPorRegalo();
  if (elegido === 'bostezo') {
    if (Date.now() - ultimoBostezo < 8 * 60e3) return cambiar('sentado', seg(4));
    ultimoBostezo = Date.now();
    decir(azar(['*bostezo* 🥱', 'Qué sueñito de la tarde… 🥱', '*bostezo* ¿Ya merito acabamos? 🥱']), 3000);
    return cambiar('bostezar', seg(2.5));
  }
  if (elegido === 'dormir' && cama && (esNoche() || Math.random() < 0.7)) {
    if (enRepisa()) return bajarAlPiso();
    if (esNoche()) window.mascota.meVoyADormir();                   // y su amiga se viene a dormir con ella
    return cambiar('ir_cama', seg(30));
  }
  if (favorito && Math.random() < 0.04 && Date.now() - ultimoFavorito > 30 * 60e3) {
    ultimoFavorito = Date.now();
    const nombres = { pelota: 'la pelota 🎾', hueso: 'el huesito 🦴', cuerda: 'la cuerda 🪢', laser: 'el láser 🔴' };
    decir(`Mi juguete favorito es ${nombres[favorito]}`, 3500);
  }
  if (candidatasRepisa.length && !enRepisa() && Date.now() - ultimaSubida > 4 * 60e3 && Math.random() < 0.5) elegido = 'trepar';
  if (elegido === 'trepar') {
    ultimaSubida = Date.now();
    const rep = azar(candidatasRepisa);
    objetivoRepisa = { ...rep, xObjetivo: Math.min(Math.max(centroX(), rep.x1 + 50), rep.x2 - 50) };
    return cambiar('ir_trepar', seg(15));
  }
  if (elegido === 'amigo') {
    if (enRepisa()) return bajarAlPiso();
    return cambiar('ir_amigo', seg(15));
  }

  const dur = {
    caminar: seg(6 + Math.random() * 8), sentado: seg(5 + Math.random() * 6),
    dormir: esNoche() ? seg(40 + Math.random() * 50) : seg(20 + Math.random() * 25),
    acurrucado: seg(20 + Math.random() * 20),
    rascar: seg(3), estirar: seg(2.5), cola: seg(3), panza: seg(6), triste: seg(12)
  }[elegido];
  if (elegido === 'caminar' && Math.random() < 0.35) voltear(-dir);
  cambiar(elegido, dur);

  // De vez en cuando dice algo o ladra
  if (Math.random() < 0.06 && !bocadillo) {
    decir(esNoche() ? azar(['Ya es tarde, ¿no? 🌙', '*bostezo*'])
      : llueve() ? azar(['Qué bueno que traje mi sombrilla ☔', 'Hoy no salgo 🌧️'])
      : animo < 30 ? azar(['Nadie me hace caso…', '*suspiro*'])
      : azar(['¡Guau!', '¿Jugamos?', '🐾', `Soy ${miNombre()} 🐶`]), 3500);
  } else if (animo > 60 && Math.random() < 0.08) ladrar(1);
}

function velocidad() {
  let v = 2;
  if (hora() >= 7 && hora() < 12) v = 2.5;
  if (esNoche()) v = 1.5;
  if (animo > 80) v += 0.5;
  if (hambre > 70) v -= 0.5;
  if (haceCalor()) v *= 0.8;
  return v * VELOCIDAD;
}

// Camina hacia una x de la pantalla. Devuelve true cuando llega.
function irHacia(xDestino, vel, margen = 8) {
  const dx = xDestino - centroX();
  if (Math.abs(dx) <= margen) return true;
  voltear(dx > 0 ? 1 : -1, true);
  avanzar(Math.min(vel, Math.abs(dx)));
  return false;
}
let recorrido = 0, rampa = 1, ultimoAvance = 0;
function avanzar(vel) {
  if (frame - ultimoAvance > 3) rampa = 0.35;                         // arranca despacito y acelera
  rampa = Math.min(1, rampa + 0.045); ultimoAvance = frame;
  vel *= rampa * (0.7 + 0.3 * TAM());                                 // chiquitas caminan un poco más lento
  recorrido += Math.abs(vel);
  const d = pantallaEn(centroX() + vel * dir * 10);
  if (!d) { voltear(-dir, true); return; }         // orilla del escritorio
  x += vel * dir;
  const piso = d.y + d.height;
  if (!enRepisa() && piso < pies() - 4) {          // pantalla vecina más alta: brinca para subir
    estado = 'aire'; vy = -Math.sqrt(2 * G * (pies() - piso + 25)); vxAire = 2 * dir * VELOCIDAD;
  }
}

function quierePerseguir() {
  if (trabajando() || animo < 30 || Date.now() < ignorarCursorHasta || tienePelota) return false;
  if (!['caminar', 'sentado', 'correr'].includes(estado)) return false;
  const dx = cursor.x - centroX();
  return Date.now() < cursorMovidoHasta && Math.abs(dx) < 220 && Math.abs(dx) > 60 &&
         cursor.y > pies() - 260 && cursor.y < pies() + 30;
}

function saludar(texto) {
  brincar(12); animo = Math.min(100, animo + 5);
  ladrar(2); lanzarCorazones(4); if (texto) decir(texto, 4000);
}

// Cosas importantes que interrumpen lo que esté haciendo
const INTERRUMPIBLE = ['caminar', 'sentado', 'rascar', 'estirar', 'cola', 'panza', 'triste', 'bostezar',
                       'teclear', 'acurrucado', 'ir_trepar', 'ir_amigo', 'correr', 'dormir'];
function revisarUrgencias() {
  if (!INTERRUMPIBLE.includes(estado) || trabajando()) return;
  const dormidoProfundo = estado === 'dormir' && dormidoPorInactividad;
  if (dormidoProfundo) return;

  // Juegos en conjunto que le pidieron
  if (paseo)       { if (enRepisa()) return bajarAlPiso(); return cambiar('pasear', 1e9); }
  if (siguiendoA)  { if (enRepisa()) return bajarAlPiso(); return cambiar('seguir', 1e9); }
  if (cuerdaJuego) { if (enRepisa()) return bajarAlPiso(); return cambiar('ir_jalar', seg(20)); }
  if (escondite)   {
    if (enRepisa()) return bajarAlPiso();
    return cambiar(escondite.rol === 'esconder' ? 'esconderse' : 'buscar_amiga', 1e9);
  }
  // ¡El láser!
  if (laser && animo >= 10) { if (enRepisa()) return bajarAlPiso(); return cambiar('perseguir_laser', seg(40)); }

  // ¡Aventaron la pelota!
  if (pelota && pelota.lanzada && !pelota.portador && !tienePelota && animo >= 20 && Date.now() > ignorarPelotaHasta &&
      (pelota.lanzadoPor === 'usuario' || Date.now() > descansoPelota)) {
    if (enRepisa()) return bajarAlPiso();
    return cambiar('buscar', seg(20));
  }
  // Hay comida y tiene hambre
  if (plato && plato.porciones > 0 && !yaComio && hambre > 10 && estado !== 'dormir') {
    if (enRepisa()) return bajarAlPiso();
    return cambiar('ir_comer', seg(25));
  }
  // Tiene sed y hay agua
  if (agua && agua.nivel > 0 && sed > 40 && Date.now() - yaBebio > 60000 && estado !== 'dormir') {
    if (enRepisa()) return bajarAlPiso();
    return cambiar('ir_beber', seg(25));
  }
  // Necesita salir al baño
  if (necesidad && estado !== 'dormir') {
    if (enRepisa()) return bajarAlPiso();
    return cambiar('pedir_salir_ir', seg(20));
  }
  // Estás escribiendo: se pone a "teclear" contigo
  if (escribiendo > 2 && ['caminar', 'sentado', 'rascar', 'cola', 'triste', 'acurrucado'].includes(estado)) {
    cambiar('teclear', 1e9);
    if (escribiendo > 40 && Date.now() - ultimoComentarioTeclado > 10 * 60e3 && PRINCIPAL) {
      ultimoComentarioTeclado = Date.now();
      decir(azar(['¡Qué rápido escribes! ⌨️', 'Yo también estoy chambeando 💼', '¡Tú puedes! 💪']), 3500);
    }
  }
}

// =====================================================================
// 6) CICLO PRINCIPAL (la lógica siempre corre a 60 pasos por segundo)
// =====================================================================
const PASO = 1000 / 60;
let ultimoT = null, acumulado = 0, ultimaPos = '';

function actualizar(t) {
  if (ultimoT === null) ultimoT = t;
  acumulado += Math.min(t - ultimoT, 250);
  ultimoT = t;
  while (acumulado >= PASO) { paso(); acumulado -= PASO; }
  const pos = Math.round(x) + ',' + Math.round(y);
  if (pos !== ultimaPos) { window.mascota.mover(x, y); ultimaPos = pos; }
  if (frame % 3 === 0) window.mascota.reporte({ estado, dir, x, y, boca: bocaVentana ? { x: x + bocaVentana.x, y: y + bocaVentana.y } : null });
  dibujar();
  requestAnimationFrame(actualizar);
}

function paso() {
  frame++;
  if (Date.now() - ultimoBajon > 20000) {
    animo = Math.max(0, animo - (hambre > 70 ? 3 : 1));
    ultimoBajon = Date.now();
  }
  actualizarEfectos();
  moverMariposa();
  if (['correr', 'buscar', 'perseguir_laser', 'cazar_mariposa', 'traer'].includes(estado) && Date.now() - ultimoTropiezo > 4 * 60e3 &&
      Math.random() < 1 / 2400) tropezar();                            // de vez en cuando se tropieza 😅
  // Pide agua o baño
  if (sed > 60 && (!agua || agua.nivel <= 0) && Date.now() - ultimoAvisoSed > 10 * 60e3 && !trabajando() && !ocupada() && estado !== 'dormir') {
    ultimoAvisoSed = Date.now();
    decir(PRINCIPAL ? 'Tengo sed… ¿me pones agüita? 💧' : 'Wuf… ¿agua? 💧', 6000);
  }
  if (suciedad > 75 && Date.now() - ultimoAvisoSucia > 30 * 60e3 && !trabajando() && !ocupada() && estado !== 'dormir') {
    ultimoAvisoSucia = Date.now();
    decir('Estoy toda sucia… ¿me bañas? 🛁', 6000);
  }
  if (cumple && !dijoCumple && frame > 180) { dijoCumple = true; decir('¡Hoy es mi cumpleaños! 🎂🎉', 0, true); lanzarConfeti(); ladrar(2, true); }
  if (cumpleAmiga && !dijoCumple && frame > 400) { dijoCumple = true; decir(`¡Feliz cumpleaños, ${PRINCIPAL ? config.nombreAmigo : config.nombre}! 🎉`, 5000); }
  // Pide comida si tiene hambre
  if (hambre > 60 && !plato && Date.now() - ultimoPedido > 10 * 60e3 && !trabajando() && estado !== 'dormir') {
    ultimoPedido = Date.now();
    decir(PRINCIPAL ? 'Tengo hambrita… ¿me sirves de comer? 🍖' : 'Wuf… ¿y mis croquetas? 🥺', 6000);
    ladrar(1);
  }

  if (estado === 'aire') {
    const piesAntes = pies();                   // así no "atraviesa" una repisa si cae muy rápido
    vy += G; y += vy; x += vxAire;
    const s = sueloActual(Math.min(piesAntes, pies()));
    if (vy >= 0 && y >= s.y - H) {
      if (vy > 6) aplaste = Math.min(1, vy / 18);     // se aplasta un poquito al caer
      y = s.y - H; vy = 0; vxAire = 0;
      if (s.piso) soloPiso = false;
      if (dormidoPorInactividad) cambiar('dormir', 1e9);
      else if (tienePelota) cambiar('traer', seg(20));
      else cambiar('sentado', seg(3));
    }
  } else if (estado !== 'arrastrado' && !arrastre && !clicPendiente) {
    tiempo--;
    revisarUrgencias();
    if (quierePerseguir() && estado !== 'correr') cambiar('correr', seg(6));

    // Voltea a ver tu cursor cuando estás cerca y está tranquila
    if (['sentado', 'acurrucado', 'triste', 'teclear'].includes(estado) && Date.now() < cursorMovidoHasta) {
      const dxc = cursor.x - centroX();
      if (Math.abs(dxc) > 45 && Math.abs(dxc) < 600 && Math.abs(cursor.y - pies()) < 450) voltear(dxc > 0 ? 1 : -1);
    }

    switch (estado) {
      case 'caminar': avanzar(velocidad()); break;

      case 'correr': {
        const dx = cursor.x - centroX();
        if (Math.abs(dx) > 50) voltear(dx > 0 ? 1 : -1);
        if (Math.abs(dx) < 30 || !quierePerseguir()) {
          ignorarCursorHasta = Date.now() + 20000;
          cambiar('sentado', seg(4)); animo = Math.min(100, animo + 2);
        } else avanzar(4 * VELOCIDAD);
        break;
      }

      case 'buscar': {
        if (!pelota || (pelota.portador && pelota.portador !== ID)) { cambiar('sentado', seg(3)); break; }
        const llego = irHacia(pelota.x, 5 * VELOCIDAD + 1, 16);
        const cerca = pelota.y > pies() - 45;
        if (llego && cerca && !esperandoPelota) {
          esperandoPelota = true;
          window.mascota.agarrarPelota().then(ok => {
            esperandoPelota = false;
            if (!ok) { cambiar('sentado', seg(3)); return; }
            tienePelota = true; ladrar(1);
            const tuya = pelota && pelota.lanzadoPor === 'usuario' && !juegoPropio;
            juegoPropio = false;
            if (tuya) { cambiar('traer', seg(20)); return; }
            if (pelota && pelota.rondas >= 6) {                         // ya se cansó: la deja y descansa
              descansoPelota = Date.now() + 3 * 60e3;
              cambiar('cansada_pelota', seg(2)); return;
            }
            cambiar(otros[0] && Math.random() < 0.65 ? 'llevar_amiga' : 'lanzar_sola', seg(15));
          });
        }
        break;
      }

      case 'llevar_amiga': {                                         // se la lleva a su amiga y se la avienta
        const amiga = otros[0];
        if (!amiga || !tienePelota) { cambiar('lanzar_sola', seg(2)); break; }
        const ax = amiga.x + OX + 70, lado = ax > centroX() ? 1 : -1;
        if (irHacia(ax - lado * 110, velocidad() + 1.5, 14)) {
          voltear(lado, true);
          soltarPelota(false, { vx: lado * 3.2, vy: -6 });
          decir(azar(['¡Te toca! 🎾', '¡Atrápala!', '¡Tuya!']), 2000);
          cambiar('sentado', seg(2.5));
        }
        break;
      }
      case 'lanzar_sola':                                            // la avienta y corre tras ella
        if (tiempo < seg(15) - 25 && tienePelota) {
          soltarPelota(false, { vx: dir * (6 + Math.random() * 4), vy: -7 });
          ignorarPelotaHasta = Date.now() + 700;               // y sale corriendo tras ella
          cambiar('sentado', 20);
        }
        break;
      case 'cansada_pelota':
        if (tienePelota) { soltarPelota(false); decir(azar(['Uf, ya me cansé 😮‍💨', 'Ahorita seguimos… 😮‍💨']), 3000); }
        if (tiempo <= 0) cambiar('acurrucado', seg(20));
        break;

      case 'traer': {
        const d = pantallaEn(centroX()) || displays[0];
        const destino = Math.min(Math.max(cursor.x, d.x + 80), d.x + d.width - 80);
        if (irHacia(destino, 4 * VELOCIDAD + 1, 40)) soltarPelota(true);
        break;
      }

      case 'ir_comer': {
        if (!plato || plato.porciones <= 0) { cambiar('sentado', seg(2)); break; }
        const lado = plato.x > centroX() ? 1 : -1;
        if (irHacia(plato.x - lado * 45, 3 * VELOCIDAD + 0.5, 4) && !esperandoComida) {
          voltear(lado, true);
          esperandoComida = true;
          window.mascota.comer().then(ok => {
            esperandoComida = false; yaComio = true;
            if (ok) cambiar('comer', seg(6));
            else { decir('Ya se acabó 😢', 2500); cambiar('sentado', seg(3)); }
          });
        }
        break;
      }

      case 'ir_trepar': {
        const sigue = objetivoRepisa && repisas.some(r => Math.abs(r.y - objetivoRepisa.y) < 3 &&
          r.x1 <= objetivoRepisa.xObjetivo && r.x2 >= objetivoRepisa.xObjetivo);
        if (!sigue) { objetivoRepisa = null; cambiar('sentado', seg(2)); break; }
        if (irHacia(objetivoRepisa.xObjetivo, velocidad() + 0.5, 6)) {
          estado = 'aire';
          vy = -Math.sqrt(2 * G * (pies() - objetivoRepisa.y + 35));
          vxAire = 0;
          objetivoRepisa = null;
        }
        break;
      }

      case 'ir_amigo': {
        const amigo = otros[0];
        if (!amigo) { cambiar('sentado', seg(2)); break; }
        const ax = amigo.x + OX + 70;
        const lado = ax > centroX() ? 1 : -1;
        if (irHacia(ax - lado * 70, velocidad() + 1, 10)) {
          voltear(lado, true);
          window.mascota.jugarCon();
          brincar(9); lanzarCorazones(3); ladrar(1);
        }
        break;
      }

      case 'teclear':
        if (escribiendo === 0) cambiar('sentado', seg(3));
        break;

      case 'perseguir_laser': {
        if (!laser) { cambiar('sentado', seg(2)); break; }
        const dx = laser.x - centroX();
        if (Math.abs(dx) > 20) { voltear(dx > 0 ? 1 : -1, true); avanzar(Math.min(Math.abs(dx), 5 * VELOCIDAD + 1.5)); }
        else if (laser.y < pies() - 40 && Math.random() < 0.04) brincar(11);
        break;
      }

      case 'ir_beber': {
        if (!agua || agua.nivel <= 0) { cambiar('sentado', seg(2)); break; }
        const lado = agua.x > centroX() ? 1 : -1;
        if (irHacia(agua.x - lado * 45, 3 * VELOCIDAD + 0.5, 4) && !esperandoAgua) {
          voltear(lado, true); esperandoAgua = true;
          window.mascota.beber().then(ok => {
            esperandoAgua = false; yaBebio = Date.now();
            cambiar(ok ? 'beber' : 'sentado', ok ? seg(4) : seg(2));
          });
        }
        break;
      }

      case 'ir_cama': {
        if (!cama) { cambiar('dormir', seg(30)); break; }
        const juntas = !!otros[0];                                   // si hay otra perrita, cada una en su ladito (nunca una encima de la otra)
        const lugar = juntas ? cama.x + (PRINCIPAL ? -52 : 66) : cama.x;
        if (irHacia(lugar, velocidad() + 0.3, 6)) {
          if (juntas && esNoche()) voltear(PRINCIPAL ? 1 : -1, true);   // de noche, acurrucadas viéndose
          enCama = true; cambiar('dormir', esNoche() ? seg(90) : seg(40));
        }
        break;
      }

      case 'cazar_mariposa': {
        if (!mariposa) { cambiar('sentado', seg(2)); break; }
        const dx = mariposa.x - centroX();
        if (Math.abs(dx) > 100) { voltear(dx > 0 ? 1 : -1); avanzar(Math.min(Math.abs(dx) - 90, 3.2 * VELOCIDAD + 1)); }
        else if (Math.random() < 0.03 && estado !== 'aire') { brincar(10 + Math.random() * 3); ladrar(1); }
        if (tiempo < seg(1.5)) mariposa.huye = true;
        break;
      }
      case 'alerta': break;

      case 'ir_por_regalo':                                          // sale por la orilla a buscar algo
        if (irHacia(orillaRegalo, velocidad() + 0.8, 6)) {
          opacidad = Math.max(0, opacidad - 0.04);
          if (opacidad === 0) cambiar('afuera_regalo', seg(6));
        }
        break;
      case 'afuera_regalo': opacidad = 0; break;
      case 'traer_regalo': {                                         // regresa con el regalo en el hocico
        opacidad = Math.min(1, opacidad + 0.05);
        const d = pantallaEn(centroX()) || displays[0];
        const destino = Math.min(Math.max(cursor.x - dir * 70, d.x + 90), d.x + d.width - 90);
        if (irHacia(destino, velocidad() + 0.8, 30)) {
          const item = regaloEnBoca; regaloEnBoca = null;
          window.mascota.dejarRegalo({ x: x + (bocaVentana ? bocaVentana.x : 150) + dir * 18, item });
          decir(azar(['¡Te traje algo! 🎁', '¡Mira lo que encontré! 🎁', '¡Es para ti! 💕']), 0, true);
          ladrar(1); cambiar('sentado', seg(6));
        }
        break;
      }

      case 'pasear': {
        if (!paseo) { cambiar('sentado', seg(2)); break; }
        if (olfateo > 0) { olfateo--; break; }                         // se detiene a olfatear
        if (Math.random() < 0.003) { olfateo = seg(1.5); break; }
        const meta = paseo.fase === 0 ? paseo.izq : paseo.fase === 1 ? paseo.der : paseo.regreso;
        if (irHacia(meta, velocidad() + 0.6, 12)) {
          paseo.fase++;
          if (paseo.fase > 2) {
            paseo = null; animo = Math.min(100, animo + 20);
            decir('¡Qué rico paseo! 🐾', 3000);
            window.mascota.evento({ tipo: 'paseo-fin' });
            cambiar('sentado', seg(4));
          }
        }
        break;
      }

      case 'seguir': {
        const a = otros.find(o => o.id === siguiendoA);
        if (!a) { siguiendoA = null; cambiar('sentado', seg(2)); break; }
        const objetivo = a.x + OX + 70 - (a.dir || 1) * 75;
        const dx = objetivo - centroX();
        if (Math.abs(dx) > 14) { voltear(dx > 0 ? 1 : -1, true); avanzar(Math.min(Math.abs(dx), velocidad() + 1.2)); }
        else voltear(a.dir || 1);
        break;
      }

      case 'ir_jalar':
        if (!cuerdaJuego) { cambiar('sentado', seg(2)); break; }
        if (irHacia(cuerdaJuego.medio - cuerdaJuego.lado * 105, velocidad() + 1, 4)) {   // con espacio para la cuerda
          voltear(cuerdaJuego.lado, true); anclaX = x; cambiar('jalar', 1e9);
        }
        break;
      case 'jalar': {
        if (!cuerdaJuego) { cambiar('sentado', seg(2)); break; }
        const amiga = otros[0];
        const lista = amiga && amiga.estado === 'jalar';
        if (lista && !cuerdaJuego.arranco) {                             // ya están las dos: empieza el jaloneo
          cuerdaJuego.arranco = true; cuerdaJuego.inicio = Date.now(); cuerdaJuego.fin = Date.now() + 12000;
        }
        if (cuerdaJuego.arranco) x = anclaX + desfaseCuerda();
        if (!cuerdaJuego.arranco && Date.now() > cuerdaJuego.fin + 15000) { cuerdaJuego = null; cambiar('sentado', seg(2)); break; }
        if (cuerdaJuego.arranco && Date.now() > cuerdaJuego.fin) {       // se acabó: una gana
          const gane = cuerdaJuego.ganadora === ID;
          cuerdaJuego = null;
          if (gane) { decir(azar(['¡Gané! 💪', '¡Es mía! 🪢', '¡Soy la más fuerte! 💪']), 3000); ladrar(2); brincar(11); lanzarCorazones(3); }
          else { decir(azar(['¡Revancha! 😤', '¡No se vale! 😤', 'Uf, qué fuerza 😅']), 3000); cambiar('sentado', seg(4)); aplaste = 1; }
        } else if (lista && frame % 140 === 0 && Math.random() < 0.6) decir(azar(['Grrr… 😤', '¡Suéltala!', 'Grrrr 🪢']), 1500);
        break;
      }

      case 'esconderse': {
        if (!escondite) { cambiar('sentado', seg(2)); break; }
        const dx = escondite.destino - centroX();
        if (Math.abs(dx) <= 4 || Date.now() > escondite.limite) {
          voltear(escondite.destino < centroX() + 5 && dx <= 0 ? 1 : -1, true);
          cambiar('escondida', seg(90)); break;
        }
        voltear(dx > 0 ? 1 : -1, true);
        x += Math.sign(dx) * Math.min(Math.abs(dx), 4 * VELOCIDAD + 1);  // se asoma por la orilla
        break;
      }

      case 'buscar_amiga': {
        const amiga = escondite && otros.find(o => o.id === escondite.amiga);
        if (!amiga) { escondite = null; cambiar('sentado', seg(2)); break; }
        if (Date.now() > escondite.limite + 90000) { escondite = null; decir('¿Dónde estás? 🥺', 3000); cambiar('sentado', seg(3)); break; }
        if (Date.now() < escondite.olfatearHasta) {                    // primero olfatea por ahí
          if (Math.random() < 0.01) voltear(-dir);
          avanzar(velocidad() * 0.7); break;
        }
        if (irHacia(amiga.x + OX + 70, velocidad() + 1, 80)) {
          decir('¡Te encontré! 😄', 3000); brincar(10); lanzarCorazones(4); ladrar(1);
          escondite = null; window.mascota.evento({ tipo: 'encontrada' });
        }
        break;
      }

      case 'celos': {
        const d = pantallaEn(centroX()) || displays[0];
        const destino = Math.min(Math.max(cursor.x, d.x + 80), d.x + d.width - 80);
        if (irHacia(destino, 4 * VELOCIDAD + 1, 40)) {
          decir(azar(['¡Yo también quiero cariño! 🥺', '¿Y a mí? 🥺', '¡Hazme caso a mí también!']), 3500);
          cambiar('sentado', seg(5));
        }
        break;
      }

      case 'pedir_salir_ir': {
        const d = pantallaEn(centroX()) || displays[0];
        const izquierda = centroX() - d.x < d.x + d.width - centroX();
        const orilla = izquierda ? d.x + 90 : d.x + d.width - 90;
        if (irHacia(orilla, velocidad() + 0.5, 8)) {
          voltear(izquierda ? -1 : 1, true);
          cambiar('pedir_salir', seg(15 * 60));                      // si no la sacas en 15 min... 😅
          decir('¡Quiero salir! 🚪', 0, true, 'salir'); ladrar(2);
        }
        break;
      }
      case 'pedir_salir':
        if (tiempo % seg(60) === 0) { ladrar(1); if (!bocadillo) decir('¡Porfa, quiero salir! 🚪', 0, true, 'salir'); }
        break;

      case 'salir':
        if (irHacia(salidaOrilla, velocidad() + 0.5, 6)) {
          opacidad = Math.max(0, opacidad - 0.03);
          if (opacidad === 0) cambiar('afuera', seg(6));
        }
        break;

      case 'bano':
        if (frotado > 2500) enjuagar();
        break;
      case 'sacudirse':
        if (frame % 2 === 0) gotas.push({ x: OX + 70 + (Math.random() - 0.5) * 60, y: OY + 60 + Math.random() * 30, vx: (Math.random() - 0.5) * 8, vy: -2 - Math.random() * 2 });
        break;
    }

    if (estado !== 'aire') {
      const s = sueloActual();
      if (y < s.y - H - 2) { estado = 'aire'; vy = 0; vxAire = 0; }   // se acabó la repisa: cae
      else if (y > s.y - H) y = s.y - H;
    }
    if (estado !== 'aire' && tiempo <= 0) {
      if (['buscar', 'traer'].includes(estado) && tienePelota) soltarPelota(false);
      elegirEstado();
    }
  }

  corazones = corazones.filter(h => (h.vida -= 1) > 0);
  corazones.forEach(h => { h.y -= 0.8; h.x += Math.sin(h.vida * 0.2) * 0.5; });
}

function actualizarEfectos() {
  gotas = gotas.filter(g => { g.vy += 0.25; g.x += g.vx; g.y += g.vy; return g.y < H; });
  brillos = brillos.filter(b => (b.vida -= 1) > 0);
  confeti = confeti.filter(c => { c.vy += 0.15; c.x += c.vx; c.y += c.vy; return c.y < H && (c.vida -= 1) > 0; });
  cepillado = Math.max(0, cepillado - 2);
  if (opacidad < 1 && !['salir', 'afuera', 'ir_por_regalo', 'afuera_regalo', 'traer_regalo'].includes(estado)) opacidad = Math.min(1, opacidad + 0.03);
  // Partículas según la temporada
  const mes = new Date().getMonth() + 1;
  const tipo = mes >= 9 && mes <= 11 ? 'hoja' : (mes === 12 || mes <= 2) ? 'nieve' : mes <= 5 ? 'petalo' : null;
  if (tipo && particulas.length < 5 && Math.random() < 1 / 50) {
    particulas.push({ tipo, x: OX - 20 + Math.random() * 180, y: OY - 30, vx: (Math.random() - 0.5) * 0.6, vy: 0.4 + Math.random() * 0.5,
                      giro: Math.random() * 6, vgiro: (Math.random() - 0.5) * 0.08, color: azar(['#e07b39', '#c1440e', '#e3a72f', '#8b5a2b']) });
  }
  particulas = particulas.filter(q => { q.x += q.vx + Math.sin(q.y / 12) * 0.3; q.y += q.vy; q.giro += q.vgiro; return q.y < H - 4; });
  // Fantasmita en octubre
  if (mes === 10 && PRINCIPAL && !fantasma && Math.random() < 1 / (60 * 150) && !trabajando()) {
    fantasma = { x: dir === 1 ? OX + 150 : OX - 30, y: OY + 10, vida: 360 };
    if (Math.random() < 0.5 && !ocupada()) { decir('¡Un fantasma! 😱', 2000); ladrar(2); }
  }
  if (fantasma) { fantasma.x += dir === 1 ? 0.3 : -0.3; if ((fantasma.vida -= 1) <= 0) fantasma = null; }
}

// Cuerda de juguete: de su hocico a la mitad del camino con el hocico de su amiga (la otra mitad la dibuja ella)
function dibujarCuerda() {
  const b = { x: bocaVentana.x - dir * 2, y: bocaVentana.y + 6 };
  const amiga = otros[0];
  let fin, tensa;
  if (amiga && amiga.estado === 'jalar' && amiga.boca) {
    const ob = { x: amiga.boca.x - x - (amiga.dir || -dir) * 2, y: amiga.boca.y - y + 6 };
    fin = { x: (b.x + ob.x) / 2, y: (b.y + ob.y) / 2 };
    tensa = true;
  } else fin = { x: b.x + dir * 26, y: b.y + 16 };                     // todavía no llega su amiga: cuelga
  const t = (Date.now() - (cuerdaJuego ? cuerdaJuego.inicio : 0)) / 1000;
  const comba = tensa ? 2 + 2 * Math.sin(t * 5.2) : 10;
  const cx = (b.x + fin.x) / 2, cy = (b.y + fin.y) / 2 + comba;
  const camino = () => { ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.quadraticCurveTo(cx, cy, fin.x, fin.y); };
  ctx.save(); ctx.lineCap = 'round';
  camino(); ctx.strokeStyle = '#7a1f2b'; ctx.lineWidth = 6.5; ctx.stroke();                    // orilla
  camino(); ctx.strokeStyle = '#e63946'; ctx.lineWidth = 4.5; ctx.stroke();
  ctx.setLineDash([4, 4]); ctx.lineDashOffset = -t * 30 * dir;                               // rayas trenzadas
  camino(); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.2; ctx.stroke();
  ctx.restore();
  elipse(b.x + dir * 3, b.y, 4.5, 4, '#c62828', '#7a1f2b');                                  // nudo en el hocico
  if (!tensa) elipse(fin.x, fin.y, 4, 3.6, '#c62828', '#7a1f2b');
}

function soltarPelota(orgulloso, lanza = null) {
  if (!tienePelota) return;
  tienePelota = false;
  const bx = bocaVentana ? x + bocaVentana.x + dir * 14 : x + OX + 10 + (dir === 1 ? 140 : -20);
  const by = bocaVentana ? y + bocaVentana.y + 4 : y + OY + 20 + 52;
  if (lanza) { window.mascota.soltarPelota({ x: bx, y: by, vx: lanza.vx, vy: lanza.vy, lanza: true }); ignorarPelotaHasta = Date.now() + 2500; return; }
  window.mascota.soltarPelota({ x: bx, y: by, vx: dir * 2.5, vy: -4, cansada: estado === 'cansada_pelota' });
  if (orgulloso) {
    animo = Math.min(100, animo + 8);
    cambiar('sentado', seg(4));
    if (Math.random() < 0.5) decir(azar(['¡Otra vez! 🎾', '¡Aquí está! 🐶', '¡Aviéntala otra vez!']), 2500);
    ladrar(1);
  }
}

// =====================================================================
// 6b) ILUSTRACIONES (sprites): Nala usa dibujos hechos a partir de su foto
// =====================================================================
const SPR = (ID === 'chispa' ? window.SPRITES_CHISPA : window.SPRITES_PIMIENTA) || null;
const IMG = {};
if (SPR) for (const n of Object.keys(SPR)) { const im = new Image(); im.src = `sprites/${ID}/${n}.png`; IMG[n] = im; }
// Poses con animación hecha en EffectCraft (títere): cuadros sprites/<perrita>/anim/<pose>_00.webp ...  (30 cuadros = 1 s)
const ANIM = {};   // pose -> [Image]
const POSES_ANIM = { parada: 30, sentada: 30, sentada_feliz: 30, acostada: 30, dormida: 60 };
const ANIM_N = ({ chispa: POSES_ANIM, pimienta: POSES_ANIM })[ID] || {};
const cargar = src => { const im = new Image(); im.src = src; return im; };
for (const [n, c] of Object.entries(ANIM_N)) {
  ANIM[n] = Array.from({ length: c }, (_, i) => cargar(`sprites/${ID}/anim/${n}_${String(i).padStart(2, '0')}.webp`));
}
// Cola que menea al caminar/correr: 8 variantes de cada dibujo; se elige por tiempo, no por el paso de las patas
const COLA_POSES = ({ chispa: ['caminar1', 'caminar3', 'caminar4', 'correr1', 'correr3', 'correr4'], pimienta: ['caminar1', 'caminar4', 'correr1', 'correr4'] })[ID] || [];
const COLA = {};
for (const n of COLA_POSES) COLA[n] = Array.from({ length: 8 }, (_, i) => cargar(`sprites/${ID}/anim/cola_${n}_${i}.webp`));
const imgDe = n => ANIM[n] ? ANIM[n][Math.floor(frame / 2) % ANIM[n].length]
                 : COLA[n] ? COLA[n][Math.floor(frame / 3) % 8] : IMG[n];
// Si alguna pose no existe para esta perrita, se usa la más parecida
const RESPALDO = { caminar2: 'caminar1', caminar3: 'caminar4', correr3: 'correr1', salto: 'correr1',
                   panza_dormida: 'panza_feliz', sentada_feliz: 'sentada', comer2: 'comer1', cargada: 'parada' };
const pose_ = n => SPR[n] ? n : (SPR[RESPALDO[n]] ? RESPALDO[n] : 'parada');
const spritesListos = () => SPR && Object.values(IMG).every(im => im.complete && im.naturalWidth > 0) && [ANIM, COLA].every(M => Object.values(M).every(l => l.every(im => im.complete && im.naturalWidth > 0)));
const lienzo = document.createElement('canvas'), lctx = lienzo.getContext('2d');
let cajaPerro = { x1: OX + 10, x2: OX + 132, y1: OY + 15, y2: OY + 118 };   // zona donde se le puede dar clic
let bocaVentana = null, aplaste = 0;
const NARIZ = 55;                                  // la nariz siempre queda a 55 px del centro (así no "brinca")
const CAMINAR = !SPR ? [] : (SPR.caminar2 ? ['caminar1', 'caminar2', 'caminar3', 'caminar4']
              : SPR.caminar3 ? ['caminar1', 'caminar4', 'caminar3', 'caminar4'] : ['caminar1', 'caminar4'].filter(n => SPR[n]));
const CORRER = SPR ? ['correr1', 'correr4', 'correr3', 'correr4'].filter(n => SPR[n]) : [];
const pasoCaminar = CAMINAR.length <= 2 ? 1.5 : 1.2;    // cada cuadro dura un poquito más
const ciclo = (lista, cada) => lista[Math.floor(frame / cada) % lista.length];
const cicloPasos = (lista, px) => lista[Math.floor(recorrido / (px * TAM())) % lista.length];   // cuadro según lo que avanzó

function spriteDe() {
  const feliz = animo > 60 || haceCalor();
  const sentada = feliz ? 'sentada_feliz' : 'sentada';
  switch (estado) {
    case 'caminar': case 'pasear': case 'seguir': case 'ir_beber': case 'ir_cama': case 'ir_jalar':
    case 'pedir_salir_ir': case 'salir': case 'ir_comer': case 'ir_amigo': case 'ir_trepar':
      return { n: cicloPasos(CAMINAR, 13 * pasoCaminar), bob: Math.abs(Math.sin(recorrido / (13 * pasoCaminar * TAM()) * Math.PI)) * 1.8 };
    case 'buscar_amiga': case 'olfatear': return { n: cicloPasos(CAMINAR, 13 * pasoCaminar), bob: 1 };
    case 'correr': case 'buscar': case 'traer': case 'perseguir_laser': case 'esconderse': case 'celos':
      return { n: cicloPasos(CORRER, 19), bob: Math.abs(Math.sin(recorrido / (19 * TAM()) * Math.PI)) * 4 };
    case 'cola': return { n: ciclo(CORRER, 6), bob: Math.abs(Math.sin(frame * 0.3)) * 6 };
    case 'teclear': return { n: sentada, bob: Math.floor(frame / 8) % 2 ? 1.5 : 0 };
    case 'rascar': return { n: 'sentada_feliz', rot: Math.sin(frame * 1.2) * 0.03 };
    case 'sentado': {
      const curiosa = Date.now() < cursorMovidoHasta && Math.abs(cursor.x - centroX()) < 160 && cursor.y < pies() - 130;
      return { n: sentada, rot: curiosa ? -0.06 : 0 };
    }
    case 'pedir_salir': case 'escondida': case 'comer_galleta': case 'bano': return { n: sentada };
    case 'pata': return { n: 'pata' };
    case 'cazar_mariposa': return { n: cicloPasos(CORRER, 19), bob: Math.abs(Math.sin(recorrido / (19 * TAM()) * Math.PI)) * 3 };
    case 'alerta': return { n: 'parada', rot: -0.03, bob: frame % 40 < 20 ? 1.5 : 0 };
    case 'tropiezo': return { n: 'acostada', rot: 0.18 * Math.max(0, tiempo / seg(1.2)) };
    case 'ir_por_regalo': case 'traer_regalo': return { n: cicloPasos(CAMINAR, 13 * pasoCaminar), bob: Math.abs(Math.sin(recorrido / (13 * pasoCaminar * TAM()) * Math.PI)) * 1.8 };
    case 'afuera_regalo': return { n: 'parada' };
    case 'bostezar': return { n: 'sentada_feliz', rot: -0.04 - Math.sin(frame * 0.06) * 0.03 };
    case 'celebrar': return { n: Math.floor(frame / 16) % 2 ? 'sentada_feliz' : 'pata', bob: Math.abs(Math.sin(frame * 0.25)) * 5 };
    case 'llevar_amiga': return { n: cicloPasos(CORRER, 19), bob: Math.abs(Math.sin(recorrido / (19 * TAM()) * Math.PI)) * 3 };
    case 'lanzar_sola': return { n: 'parada', rot: Math.sin(frame * 0.5) * 0.08 };
    case 'cansada_pelota': return { n: 'sentada' };
    case 'aire': return { n: 'salto', sombra: false };
    case 'arrastrado': return { n: 'cargada', sombra: false, rot: Math.sin(frame * 0.15) * 0.06 };
    case 'estirar': return { n: 'estirar' };
    case 'dormir': return { n: 'dormida', respira: true };
    case 'acurrucado': case 'triste': case 'roer': return { n: 'acostada', respira: estado !== 'roer' };
    case 'panza': return { n: Math.floor(frame / 45) % 2 ? 'panza_feliz' : 'panza', rot: Math.sin(frame * 0.25) * 0.03 };
    case 'muertita': return { n: 'panza_dormida' };
    case 'rodar': return { n: 'panza_feliz', giro: (frame * 0.12) % (Math.PI * 2) };
    case 'comer': case 'beber': return { n: Math.floor(frame / 14) % 2 ? 'comer2' : 'comer1' };
    case 'sacudirse': return { n: 'parada', rot: Math.sin(frame * 1.1) * 0.08 };
    case 'jalar': return { n: 'estirar', rot: -0.05 + Math.sin(frame * 0.35) * 0.025 };
    default: return { n: 'parada' };
  }
}

// ---- Transiciones suaves ----
const capa = document.createElement('canvas'); capa.width = W; capa.height = H;
const capaVieja = document.createElement('canvas'); capaVieja.width = W; capaVieja.height = H;
let claveAnterior = '', mezcla = 0;
const familia = n => n.replace(/\d+$/, '').replace(/_feliz$/, '');      // caminar1..4 son la misma familia
function dibujarConTransicion() {
  const clave = familia(pose_(spriteDe().n));
  if (claveAnterior && clave !== claveAnterior) {                     // cambió de pose: guardo cómo se veía
    const c = capaVieja.getContext('2d'); c.clearRect(0, 0, W, H); c.drawImage(capa, 0, 0);
    mezcla = 1;
  }
  claveAnterior = clave;
  const principal = ctx;                                              // dibujo la pose nueva en su capa
  const cc = capa.getContext('2d'); cc.clearRect(0, 0, W, H);
  ctx = cc; try { dibujarSprite(); } finally { ctx = principal; }
  if (mezcla > 0) {
    ctx.save(); ctx.globalAlpha = mezcla; ctx.drawImage(capaVieja, 0, 0); ctx.restore();
    ctx.save(); ctx.globalAlpha = 1 - mezcla * 0.6; ctx.drawImage(capa, 0, 0); ctx.restore();
    mezcla = Math.max(0, mezcla - 0.14);                              // ~7 cuadros (un instante)
  } else ctx.drawImage(capa, 0, 0);
}

function dibujarSprite() {
  const sp = spriteDe(); sp.n = pose_(sp.n);
  const d = SPR[sp.n], img = imgDe(sp.n);
  const w = d.w, h = d.h;
  // 1) La perrita en un lienzo aparte, con ropa y lodo pintados solo encima de ella
  lienzo.width = Math.ceil(w * 2); lienzo.height = Math.ceil(h * 2);
  lctx.drawImage(img, 0, 0, lienzo.width, lienzo.height);
  lctx.globalCompositeOperation = 'source-atop';
  const erguida = !['dormida', 'acostada', 'panza', 'panza_feliz', 'panza_dormida'].includes(sp.n);
  const torso = zonaCuerpo(sp.n);                                     // x, y, ancho, alto (fracciones)
  const T = [torso[0] * lienzo.width, torso[1] * lienzo.height, torso[2] * lienzo.width, torso[3] * lienzo.height];
  if (accesorioActual() === 'calabaza') {                // disfraz de calabaza 🎃 (con la sombra del pelo)
    const cx2 = T[0] + T[2] / 2, cy2 = T[1] + T[3] / 2;
    lctx.save(); lctx.beginPath(); lctx.ellipse(cx2, cy2, T[2] / 2, T[3] / 2, 0, 0, Math.PI * 2); lctx.clip();
    const gr = lctx.createLinearGradient(0, T[1], 0, T[1] + T[3]);
    gr.addColorStop(0, '#ffad4a'); gr.addColorStop(1, '#e0761a');
    lctx.fillStyle = gr; lctx.fillRect(T[0], T[1], T[2], T[3]);
    lctx.globalCompositeOperation = 'multiply'; lctx.globalAlpha = 0.45; lctx.drawImage(img, 0, 0, lienzo.width, lienzo.height);   // conserva los pliegues
    lctx.globalCompositeOperation = 'source-atop'; lctx.globalAlpha = 1;
    lctx.strokeStyle = 'rgba(150,70,10,0.55)'; lctx.lineWidth = 3;
    for (let q = -1; q <= 1; q++) { lctx.beginPath(); lctx.ellipse(cx2 + q * T[2] / 4.5, cy2, T[2] / 7, T[3] / 2.05, 0, 0, Math.PI * 2); lctx.stroke(); }
    lctx.restore();
    lctx.save(); lctx.strokeStyle = 'rgba(120,55,5,0.9)'; lctx.lineWidth = 3;  // orilla del disfraz
    lctx.beginPath(); lctx.ellipse(cx2, cy2, T[2] / 2 - 1.5, T[3] / 2 - 1.5, 0, 0, Math.PI * 2); lctx.stroke(); lctx.restore();
  }
  if (suciedad > 35) {                                                // manchitas de lodo
    const manchas = Math.min(6, Math.floor((suciedad - 35) / 11) + 1);
    lctx.fillStyle = 'rgba(110,75,40,0.85)';
    [[0.3, 0.45], [0.55, 0.7], [0.4, 0.85], [0.65, 0.4], [0.2, 0.7], [0.5, 0.25]].slice(0, manchas).forEach(([fx, fy], k) => {
      lctx.beginPath(); lctx.ellipse(T[0] + fx * T[2], T[1] + fy * T[3], 11 - k, 8 - k / 2, 0.4, 0, Math.PI * 2); lctx.fill();
    });
  }
  lctx.globalCompositeOperation = 'source-over';

  // 2) Colocarla en la ventana: centro abajo, mirando hacia donde camina
  const CX = 150, BASE = H - 4;
  // Volteo animado: se "gira" en vez de cambiar de lado de golpe
  if (dirVis !== dir && giroT === 0) giroT = 1;
  if (giroT > 0) { giroT = Math.max(0, giroT - 0.11); if (giroT <= 0.5) dirVis = dir; }
  const dv = dirVis, fx = giroT > 0 ? Math.max(0.12, Math.abs(giroT * 2 - 1)) : 1;
  let sx = (1 + Math.min(peso, 100) / 400) * TAM(), sy = TAM();      // gordita si come muchas galletas
  if (sp.respira && !ANIM[sp.n]) sy *= 1 + Math.sin(frame * 0.05) * 0.02;
  if (aplaste > 0) { sx *= 1 + aplaste * 0.12; sy *= 1 - aplaste * 0.15; aplaste = Math.max(0, aplaste - 0.08); }
  if (estado === 'aire' && vy < -2) { sy *= 1 + Math.min(0.1, -vy / 120); sx *= 1 - Math.min(0.06, -vy / 200); }   // se estira al saltar
  const x0 = NARIZ - d.boca[0];                                       // posición del dibujo respecto al centro
  ctx.save();
  ctx.globalAlpha = opacidad;
  // sombrita en el piso
  if (sp.sombra !== false && opacidad > 0.5) {
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.beginPath(); ctx.ellipse(CX + dv * (x0 + w / 2) * sx, BASE + 1, w * 0.38 * sx * fx + 4, 5 * TAM(), 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.translate(CX, BASE - (sp.bob || 0));
  if (enCama && estado === 'dormir') ctx.translate(0, -12);
  if (dv === -1) ctx.scale(-1, 1);
  ctx.scale(sx, sy);
  if (fx < 1) { ctx.translate(x0 + w / 2, 0); ctx.scale(fx, 1); ctx.translate(-(x0 + w / 2), 0); }
  if (sp.rot) ctx.rotate(sp.rot);
  if (sp.giro) { ctx.translate(x0 + w / 2, -h / 2); ctx.rotate(sp.giro); ctx.translate(-(x0 + w / 2), h / 2); }
  ctx.drawImage(lienzo, x0, -h, w, h);
  // 3) Accesorios en la cabeza y cosas en el hocico (con las mismas medidas del dibujo anterior)
  const k = 1.25, cab = [x0 + d.cabeza[0], -h + d.cabeza[1]], boca = [x0 + d.boca[0], -h + d.boca[1]];
  const an = (ANCLAS[ID] || {})[sp.n];
  const deEspaldas = ['panza', 'panza_feliz', 'panza_dormida'].includes(sp.n);
  let topeSombrero = an ? -h + an[1] : cab[1];
  if (an && !deEspaldas) {
    // Medidas marcadas a mano en cada pose: cabeza [x, y, ancho, inclinación] y cuello [x, y]
    const [hx, hy, ancho, ang, nx, ny] = an;
    const kc = ancho / 36;                                              // tamaño del accesorio según su cabeza
    const acc = accesorioActual();
    const enCuello = ['collar', 'paliacate', 'patrio'].includes(acc);
    const cuelloVisible = !['dormida', 'estirar', 'comer1', 'comer2'].includes(sp.n);
    if (cuelloVisible && (haceFrio() || enCuello)) {
      ctx.save(); ctx.translate(x0 + nx, -h + ny); ctx.rotate(ang * 0.6); ctx.scale(kc, kc);
      if (haceFrio()) dibujarBufandaCuello(); else dibujarCuello(acc);
      ctx.restore();
    }
    if (!enCuello && acc !== 'ninguno') {
      ctx.save(); ctx.translate(x0 + hx, -h + hy - 1 * kc); ctx.rotate(ang); ctx.scale(-kc, kc); ctx.translate(-88, 0);   // espejo: la punta cae hacia atrás
      dibujarAccesorioCabeza();
      ctx.restore();
      if (['bruja', 'navidad', 'fiesta'].includes(acc)) topeSombrero = -h + hy - 30 * kc;
      else if (acc === 'muertos') topeSombrero = -h + hy - 8 * kc;
      else if (acc === 'calabaza') topeSombrero = -h + hy - 10 * kc;
      else if (acc === 'gorro_calabaza') topeSombrero = -h + hy - 26 * kc;
      else if (acc === 'murcielago') topeSombrero = -h + hy - 18 * kc;
    }
    if (llueve() && !['bano', 'arrastrado'].includes(estado))
      dibujarSombrillaLocal(x0 + nx - ancho * 0.7, -h + ny + 2, topeSombrero - (sp.n.startsWith('comer') ? 14 : 0), ancho, CX, BASE - (sp.bob || 0), sx, sy);
  } else if (!deEspaldas) {
    ctx.save(); ctx.translate(cab[0], cab[1] + 6); ctx.scale(k, k); ctx.translate(-88, 0);
    if (haceFrio() && erguida && !sp.n.startsWith('comer')) dibujarBufanda();
    else if (erguida || !['collar', 'paliacate', 'patrio'].includes(accesorioActual())) dibujarAccesorioCabeza();
    ctx.restore();
  }
  if (deEspaldas && llueve() && !['bano', 'arrastrado'].includes(estado))
    dibujarSombrillaLocal(x0 + w * 0.55, -h * 0.6, -h - 4, 32, CX, BASE - (sp.bob || 0), sx, sy);
  if (regaloEnBoca && estado === 'traer_regalo') {
    ctx.save(); ctx.translate(boca[0] - 2, boca[1] + 9); ctx.scale(k, k); dibujarRegaloBoca(regaloEnBoca); ctx.restore();
  }
  if (tienePelota || estado === 'roer' || (estado === 'comer_galleta' && frame % 30 < 22)) {
    ctx.save(); ctx.translate(boca[0] - 4, boca[1] + 10); ctx.scale(k, k);
    if (tienePelota) { elipse(0, 0, 8, 8, '#d4ec4a', '#8fa51f'); ctx.beginPath(); ctx.arc(-7, 0, 6, -0.9, 0.9); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke(); }
    else if (estado === 'roer') { trazo([[-10, 0], [12, 0]], 5, '#f5f0e1', false); [[-11, -3], [-11, 3], [13, -3], [13, 3]].forEach(([hx, hy]) => elipse(hx, hy, 3.5, 3.5, '#f5f0e1', '#c9bfa5')); }
    else if (estado === 'comer_galleta') { elipse(0, 0, 6, 6, '#c68642', '#8b5a2b'); }
    else trazo([[0, 0], [12, 2]], 4, '#e63946', false);
    ctx.restore();
  }
  if (estado === 'bano') {                                            // tina
    ctx.save(); ctx.globalAlpha = 0.95;
    const tx1 = x0 - 6, tx2 = x0 + w + 6;
    poligono([[tx1, -34], [tx2, -34], [tx2 - 8, 0], [tx1 + 8, 0]], '#e9f4fb', '#8fb8d1');
    elipse((tx1 + tx2) / 2, -34, (tx2 - tx1) / 2, 6, '#cfe8f7', '#8fb8d1');
    ctx.restore();
  }
  ctx.restore();

  // 4) Zona de clic y posición del hocico en la ventana
  const izq = dv === 1 ? CX + x0 * sx : CX - (x0 + w) * sx;
  cajaPerro = { x1: izq, x2: izq + w * sx, y1: BASE - h * sy - (sp.bob || 0), y2: BASE };
  bocaVentana = { x: CX + dv * boca[0] * sx, y: BASE + boca[1] * sy };
  if (!SPR || !ANCLAS[ID]) {
    const sombrero = ['bruja', 'navidad', 'fiesta', 'muertos'].includes(accesorioActual()) && !deEspaldas;
    if (llueve() && !['bano', 'arrastrado'].includes(estado)) dibujarSombrilla(cajaPerro, CX + dir * (cab[0] - 18) * sx, sombrero ? 34 : 0);
  }
}

// Puntos marcados a mano en cada dibujo: [cabezaX, cabezaY, anchoCabeza, inclinación, cuelloX, cuelloY]
const ANCLAS = {
  chispa: {
    parada: [87, 6, 32, 0, 88, 42],        sentada: [96, 7, 32, 0, 99, 45],      sentada_feliz: [90, 6, 32, 0, 97, 45],
    caminar1: [93, 6, 32, 0, 97, 46],      caminar3: [121, 6, 32, 0, 126, 47],   caminar4: [98, 6, 32, 0, 103, 47],
    correr1: [100, 7, 32, 0.05, 106, 46],  correr3: [112, 10, 32, 0.1, 116, 49], correr4: [98, 8, 32, 0.05, 101, 47],
    comer1: [104, 41, 32, 0.5, 97, 52],    comer2: [104, 36, 32, 0.45, 97, 50],  pata: [86, 7, 32, 0, 84, 48],
    cargada: [88, 7, 32, 0, 77, 49],       estirar: [93, 45, 32, 0.05, 88, 72],  acostada: [104, 6, 32, 0, 107, 42],
    dormida: [122, 14, 30, 0.15, 101, 27]
  },
  pimienta: {
    parada: [63, 6, 26, 0, 63, 40],        sentada: [74, 6, 26, 0, 68, 42],      sentada_feliz: [74, 6, 26, 0, 68, 42],
    caminar1: [66, 6, 26, 0, 66, 41],      caminar4: [70, 6, 26, 0, 69, 42],     correr1: [82, 6, 26, 0.05, 76, 40],
    correr4: [71, 6, 26, 0.05, 70, 40],    comer1: [84, 12, 26, 0.25, 75, 32],   comer2: [84, 12, 26, 0.25, 75, 32],
    pata: [65, 6, 26, 0, 65, 40],          cargada: [35, 6, 26, 0, 35, 53],      estirar: [74, 9, 26, 0.05, 70, 40],
    acostada: [75, 6, 26, 0, 72, 40],      dormida: [86, 8, 26, 0.1, 80, 26]
  }
};

// Collar, paliacate y paliacate patrio, dibujados con el cuello en (0, 0)
function dibujarCuello(acc) {
  if (acc === 'collar') {
    ctx.save(); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-6, -4); ctx.quadraticCurveTo(-1, 3, 6, 5);
    ctx.strokeStyle = '#6d0d18'; ctx.lineWidth = 6; ctx.stroke();
    ctx.strokeStyle = '#d7263d'; ctx.lineWidth = 4; ctx.stroke();
    ctx.restore();
    trazo([[3.5, 5], [4, 8]], 1.4, '#9e7a12', false);
    elipse(4.3, 10.5, 3.2, 3.2, '#f4c542', '#9e7a12');                  // placa dorada
    elipse(3.4, 9.6, 1.1, 0.9, '#fff5c2', null);
    return;
  }
  const tri = [[-7, -4], [8, 5], [1, 17]];                              // pañuelo bajo la barbilla
  ctx.save();
  ctx.beginPath(); ctx.moveTo(...tri[0]); ctx.lineTo(...tri[1]); ctx.lineTo(...tri[2]); ctx.closePath(); ctx.clip();
  if (acc === 'patrio') {
    [['#006847', -12], ['#ffffff', -3], ['#ce1126', 6]].forEach(([col, x0]) => { ctx.fillStyle = col; ctx.fillRect(x0, -8, 9, 30); });
  } else {
    ctx.fillStyle = '#c8102e'; ctx.fillRect(-10, -8, 22, 30);
    ctx.fillStyle = 'rgba(0,0,0,0.15)'; ctx.fillRect(-10, 8, 22, 14);
    ctx.fillStyle = '#ffffff';
    [[-2, 1], [3, 4], [1, 10], [-4, 4]].forEach(([px, py]) => { ctx.beginPath(); ctx.arc(px, py, 1.1, 0, Math.PI * 2); ctx.fill(); });
  }
  ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.moveTo(...tri[0]); ctx.lineTo(...tri[1]); ctx.lineTo(...tri[2]); ctx.closePath();
  ctx.strokeStyle = 'rgba(60,10,10,0.8)'; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.lineCap = 'round'; ctx.strokeStyle = acc === 'patrio' ? '#006847' : '#9e0c22'; ctx.lineWidth = 2.6;   // nudo
  ctx.beginPath(); ctx.moveTo(-7, -4); ctx.lineTo(8, 5); ctx.stroke();
  ctx.restore();
}

// Bufanda tejida a rayas, con el cuello en (0, 0)
function dibujarBufandaCuello() {
  const [c1, c2] = PRINCIPAL ? ['#c62828', '#f4f4f4'] : ['#1e88a8', '#f4f4f4'];
  const meneo = Math.sin(frame * 0.12) * 1.5;
  const franjas = (p, ancho) => {                                       // tira con rayas
    ctx.save(); ctx.lineCap = 'butt';
    ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = ancho + 1.6; p(); ctx.stroke();
    ctx.strokeStyle = c1; ctx.lineWidth = ancho; p(); ctx.stroke();
    ctx.setLineDash([2.5, 3.5]); ctx.strokeStyle = c2; ctx.lineWidth = ancho; p(); ctx.stroke();
    ctx.restore();
  };
  franjas(() => { ctx.beginPath(); ctx.moveTo(2, 5); ctx.lineTo(0 + meneo, 17); }, 5);   // la punta que cuelga
  for (let f = -1; f <= 1; f++) trazo([[f * 1.6 + meneo, 17.5], [f * 1.6 + meneo, 21]], 1.1, c1, false);
  franjas(() => { ctx.beginPath(); ctx.moveTo(-7, -4); ctx.quadraticCurveTo(-1, 4, 8, 5); }, 7.5);   // vuelta al cuello
}

// Sombrilla recargada en su hombro: el gancho en la espalda y la tela arriba del sombrero
function dibujarSombrillaLocal(mx, my, tope, ancho, CX, base, sx, sy) {
  const r = Math.max(38, Math.min(62, ancho * 1.9));
  const yBorde = Math.min(tope - 6, my - 46);                         // un poco arriba de la cabeza (o del sombrero)
  const tipX = mx + 6, tipY = yBorde - r * 0.75;
  const ladeo = Math.sin(frame * 0.03) * 0.04 - 0.1;
  const [c1, c2, osc] = PRINCIPAL ? ['#e53935', '#ffffff', '#b71c1c'] : ['#3f8fd8', '#e8f3ff', '#2a6aa8'];
  ctx.save();
  ctx.translate(mx, my); ctx.rotate(ladeo); ctx.translate(-mx, -my);
  ctx.strokeStyle = '#5d4037'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';           // bastón con gancho en la espalda
  ctx.beginPath(); ctx.moveTo(tipX, tipY); ctx.lineTo(mx, my - 4); ctx.arc(mx - 5, my - 4, 5, 0, Math.PI); ctx.stroke();
  const cx = tipX, gajos = 6;
  for (let i = 0; i < gajos; i++) {
    const a0 = Math.PI + (i / gajos) * Math.PI, a1 = Math.PI + ((i + 1) / gajos) * Math.PI;
    ctx.beginPath(); ctx.moveTo(cx, tipY);
    ctx.lineTo(cx + Math.cos(a0) * r, yBorde);
    ctx.quadraticCurveTo(cx + Math.cos((a0 + a1) / 2) * r * 0.82, yBorde + 5, cx + Math.cos(a1) * r, yBorde);
    ctx.closePath();
    const g = ctx.createLinearGradient(0, tipY, 0, yBorde + 4);
    g.addColorStop(0, i % 2 ? c2 : c1); g.addColorStop(1, i % 2 ? '#d9d9d9' : osc);
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = 'rgba(40,20,20,0.55)'; ctx.lineWidth = 1.2; ctx.stroke();
  }
  ctx.beginPath(); ctx.ellipse(cx - r * 0.35, yBorde - r * 0.33, r * 0.22, r * 0.07, -0.5, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fill();
  ctx.fillStyle = '#5d4037'; ctx.beginPath(); ctx.arc(cx, tipY - 3, 2.5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  const xa = CX + dirVis * (cx - r) * sx, xb = CX + dirVis * (cx + r) * sx;          // para que la lluvia no caiga debajo
  sombrillaZona = { x1: Math.min(xa, xb) - 4, x2: Math.max(xa, xb) + 4, y: base + tipY * sy };
}

// Zona del cuerpo (sin cabeza ni patas) en cada pose, para la ropa y el lodo
function zonaCuerpo(n) {
  if (n.startsWith('sentada') || n === 'pata') return [0.22, 0.38, 0.42, 0.42];
  if (n === 'acostada' || n === 'dormida') return [0.14, 0.28, 0.55, 0.5];
  if (n.startsWith('panza')) return [0.2, 0.25, 0.55, 0.45];
  if (n === 'estirar') return [0.1, 0.25, 0.5, 0.42];
  if (n === 'cargada') return [0.25, 0.3, 0.45, 0.35];
  if (n.startsWith('comer')) return [0.12, 0.2, 0.55, 0.4];
  return [0.14, 0.32, 0.56, 0.36];                                     // de pie, caminando, corriendo
}

// Bufanda tejida (cuando hace frío) — mismas coordenadas que el collar
function dibujarBufanda() {
  const color = PRINCIPAL ? '#c62828' : '#1e88a8';
  const meneo = Math.sin(frame * 0.12) * 3;
  trazo([[73, 34], [66 + meneo / 2, 46], [62 + meneo, 56]], 7, color, false);           // la punta que cuelga
  for (let f = 0; f < 3; f++) trazo([[60 + meneo + f * 2.5, 56], [59 + meneo + f * 2.5, 61]], 1.5, '#ffffff', false);
  ctx.save();
  ctx.beginPath(); ctx.moveTo(64, 26); ctx.quadraticCurveTo(76, 40, 92, 33); ctx.lineWidth = 11; ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 13; ctx.stroke();
  ctx.strokeStyle = color; ctx.lineWidth = 11; ctx.stroke();
  ctx.setLineDash([3, 5]); ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 2; ctx.stroke();      // puntadas
  ctx.restore();
}

// Sombrilla que sostiene sobre su cabeza cuando llueve
function dibujarSombrilla(caja, cxCab, extra = 0) {
  const ancho = Math.max(90, Math.min(140, (caja.x2 - caja.x1) * 0.95));
  const r = ancho / 2;
  const cx = (cxCab * 0.6 + (caja.x1 + caja.x2) / 2 * 0.4);
  const yBorde = Math.max(r * 0.75 + 8, caja.y1 - 8 - extra);
  const ladeo = Math.sin(frame * 0.03) * 0.05 - dir * 0.08;
  const [c1, c2] = PRINCIPAL ? ['#e53935', '#ffffff'] : ['#3f8fd8', '#e8f3ff'];
  ctx.save();
  ctx.translate(cx, yBorde); ctx.rotate(ladeo);
  // bastón con su gancho
  ctx.strokeStyle = '#5d4037'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, -r * 0.75); ctx.lineTo(0, 26); ctx.arc(-5, 26, 5, 0, Math.PI); ctx.stroke();
  // tela por gajos
  const gajos = 6;
  for (let i = 0; i < gajos; i++) {
    const a0 = Math.PI + (i / gajos) * Math.PI, a1 = Math.PI + ((i + 1) / gajos) * Math.PI;
    ctx.beginPath();
    ctx.moveTo(0, -r * 0.75);
    ctx.lineTo(Math.cos(a0) * r, 0);
    const mx = Math.cos((a0 + a1) / 2) * r * 0.82, my = 5;                   // borde ondulado
    ctx.quadraticCurveTo(mx, my, Math.cos(a1) * r, 0);
    ctx.closePath();
    const g = ctx.createLinearGradient(0, -r * 0.75, 0, 4);
    const base = i % 2 ? c2 : c1;
    g.addColorStop(0, base); g.addColorStop(1, i % 2 ? '#d9d9d9' : (PRINCIPAL ? '#b71c1c' : '#2a6aa8'));
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = 'rgba(40,20,20,0.55)'; ctx.lineWidth = 1.2; ctx.stroke();
  }
  // brillo y puntita
  ctx.beginPath(); ctx.ellipse(-r * 0.35, -r * 0.42, r * 0.22, r * 0.07, -0.5, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fill();
  ctx.fillStyle = '#5d4037'; ctx.beginPath(); ctx.arc(0, -r * 0.75 - 3, 2.5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  sombrillaZona = { x1: cx - r - 4, x2: cx + r + 4, y: yBorde - r * 0.75 };
}
let sombrillaZona = null;

// =====================================================================
// 7) HERRAMIENTAS DE DIBUJO
// =====================================================================
function elipse(cx, cy, rx, ry, relleno, borde = C.borde, rot = 0) {
  ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, rot, 0, Math.PI * 2);
  ctx.fillStyle = relleno; ctx.fill();
  if (borde) { ctx.strokeStyle = borde; ctx.lineWidth = 2; ctx.stroke(); }
}
function trazo(puntos, grosor, color, conBorde = true) {
  const pasadas = conBorde ? [[grosor + 2, C.borde], [grosor, color]] : [[grosor, color]];
  for (const [g, c] of pasadas) {
    ctx.beginPath(); ctx.lineWidth = g; ctx.strokeStyle = c; ctx.lineCap = 'round';
    ctx.moveTo(...puntos[0]);
    if (puntos.length === 3) ctx.quadraticCurveTo(...puntos[1], ...puntos[2]);
    else ctx.lineTo(...puntos[1]);
    ctx.stroke();
  }
}
function poligono(puntos, relleno, borde = C.borde) {
  ctx.beginPath(); ctx.moveTo(...puntos[0]);
  puntos.slice(1).forEach(p => ctx.lineTo(...p));
  ctx.closePath(); ctx.fillStyle = relleno; ctx.fill();
  if (borde) { ctx.strokeStyle = borde; ctx.lineWidth = 1.5; ctx.stroke(); }
}
function ojosFelices(cx, cy) {
  ctx.beginPath(); ctx.arc(cx, cy + 2, 3.5, Math.PI * 1.15, Math.PI * 1.85);
  ctx.strokeStyle = RAZA === 'labrador' ? '#d0d0d0' : '#222'; ctx.lineWidth = 2; ctx.stroke();
}
function corazon(cx, cy, s, alfa) {
  ctx.save(); ctx.globalAlpha = alfa; ctx.fillStyle = COMUN.corazon;
  ctx.beginPath();
  ctx.moveTo(cx, cy + s * 0.3);
  ctx.bezierCurveTo(cx - s, cy - s * 0.5, cx - s * 0.4, cy - s * 1.2, cx, cy - s * 0.5);
  ctx.bezierCurveTo(cx + s * 0.4, cy - s * 1.2, cx + s, cy - s * 0.5, cx, cy + s * 0.3);
  ctx.fill(); ctx.restore();
}
function recortarElipse(cx, cy, rx, ry, dibujo) {
  ctx.save(); ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); ctx.clip(); dibujo(); ctx.restore();
}

// =====================================================================
// 8) ACCESORIOS según la fecha (o el que elijas en Ajustes)
// =====================================================================
function accesorioActual() {
  if (cumple) return 'fiesta';                                          // ¡su cumpleaños!
  const halloweenDona = 'gorro_calabaza';                               // gorrito de calabaza 🎃
  if (config.accesorio === 'halloween') return PRINCIPAL ? 'bruja' : halloweenDona;
  if (config.accesorio && config.accesorio !== 'auto') return config.accesorio;
  const d = new Date(), m = d.getMonth() + 1, dia = d.getDate();
  if (m === 9) return 'patrio';                                        // Fiestas Patrias
  if (m === 10) return PRINCIPAL ? 'bruja' : halloweenDona;            // Halloween todo octubre
  if (m === 11 && dia <= 2) return 'muertos';
  if (m === 12 || (m === 1 && dia <= 6)) return 'navidad';
  return PRINCIPAL ? 'collar' : 'paliacate';
}
// Gorrito de calabaza 🎃: una calabacita con carita, sentada sobre la cabeza (cabeza en 88, 0)
function dibujarGorroCalabaza() {
  const cx = 88, cy = -9;
  ctx.save();
  const g = ctx.createRadialGradient(cx - 5, cy - 5, 2, cx, cy, 17);
  g.addColorStop(0, '#ffb347'); g.addColorStop(0.7, '#f28c28'); g.addColorStop(1, '#d9661a');
  [[-9, 9], [9, 9], [-4, 11], [4, 11], [0, 12]].forEach(([dx, rx]) => {            // gajos
    ctx.beginPath(); ctx.ellipse(cx + dx, cy, rx, 10, 0, 0, Math.PI * 2);
    ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = '#a84a0c'; ctx.lineWidth = 1.4; ctx.stroke();
  });
  ctx.fillStyle = '#5a3a12'; ctx.beginPath(); ctx.moveTo(cx - 2, cy - 9); ctx.lineTo(cx + 2, cy - 9);       // tallito
  ctx.lineTo(cx + 3.5, cy - 15); ctx.lineTo(cx - 0.5, cy - 15.5); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#4caf50'; ctx.strokeStyle = '#2e7d32'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.ellipse(cx + 6, cy - 13, 5, 2.4, -0.4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();   // hojita
  ctx.fillStyle = '#3b1d05';                                             // carita (simétrica, se ve igual de los dos lados)
  [[-5, -2], [5, -2]].forEach(([dx, dy]) => { ctx.beginPath(); ctx.moveTo(cx + dx - 3, cy + dy + 2); ctx.lineTo(cx + dx + 3, cy + dy + 2); ctx.lineTo(cx + dx, cy + dy - 3); ctx.closePath(); ctx.fill(); });
  ctx.beginPath(); ctx.moveTo(cx - 7, cy + 3); ctx.quadraticCurveTo(cx, cy + 9, cx + 7, cy + 3);
  ctx.lineTo(cx + 4, cy + 4.5); ctx.lineTo(cx + 2, cy + 3.5); ctx.lineTo(cx, cy + 5); ctx.lineTo(cx - 2, cy + 3.5); ctx.lineTo(cx - 4, cy + 4.5); ctx.closePath(); ctx.fill();
  ctx.restore();
}

// Diadema con murcielaguito 🦇 (cabeza en 88, 0)
function dibujarDiademaMurcielago() {
  const cx = 88, aleteo = Math.sin(frame * 0.15) * 1.5;
  ctx.save(); ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(cx, 9, 14, Math.PI * 1.12, Math.PI * 1.88);   // la diadema
  ctx.strokeStyle = '#111'; ctx.lineWidth = 3; ctx.stroke();
  trazo([[cx, -4], [cx, -8]], 1.5, '#111', false);                       // resorte
  const y = -13;
  ctx.fillStyle = '#1b1b1b'; ctx.strokeStyle = '#000'; ctx.lineWidth = 0.8;
  [-1, 1].forEach(l => {                                                 // alas
    ctx.beginPath(); ctx.moveTo(cx + l * 2, y - 1);
    ctx.quadraticCurveTo(cx + l * 8, y - 7 - aleteo, cx + l * 15, y - 4 - aleteo);
    ctx.quadraticCurveTo(cx + l * 13, y + 1, cx + l * 11, y + 3);
    ctx.quadraticCurveTo(cx + l * 9, y + 1, cx + l * 7, y + 3);
    ctx.quadraticCurveTo(cx + l * 5, y + 1, cx + l * 2, y + 3); ctx.closePath(); ctx.fill(); ctx.stroke();
  });
  ctx.beginPath(); ctx.ellipse(cx, y + 1, 3.2, 4, 0, 0, Math.PI * 2); ctx.fill();         // cuerpito
  ctx.beginPath(); ctx.moveTo(cx - 2.5, y - 2); ctx.lineTo(cx - 1.5, y - 5.5); ctx.lineTo(cx - 0.5, y - 2.5); ctx.fill();   // orejitas
  ctx.beginPath(); ctx.moveTo(cx + 2.5, y - 2); ctx.lineTo(cx + 1.5, y - 5.5); ctx.lineTo(cx + 0.5, y - 2.5); ctx.fill();
  ctx.fillStyle = '#ffd23f'; [[-1.2, 0], [1.2, 0]].forEach(([dx]) => { ctx.beginPath(); ctx.arc(cx + dx, y, 0.8, 0, Math.PI * 2); ctx.fill(); });
  ctx.restore();
}

function dibujarAccesorioCabeza() {           // mismo dibujo, con la cabeza en (88, 0)
  dibujarAccesorio(0, true);
}
function dibujarAccesorio(cy, sprite = false) {
  const a = accesorioActual();
  if (a === 'gorro_calabaza') { dibujarGorroCalabaza(); return; }
  if (a === 'murcielago') { dibujarDiademaMurcielago(); return; }
  if (sprite && a === 'calabaza') { trazo([[88, -1], [90, -9]], 4, '#4a7a2a', false); elipse(95, -8, 5, 2.5, '#5f9e34', '#3d6b1f', -0.4); return; }
  if (sprite && (a === 'collar' || a === 'paliacate' || a === 'patrio')) cy -= 2;
  const acostado = ['dormir', 'acurrucado', 'triste', 'estirar'].includes(estado);
