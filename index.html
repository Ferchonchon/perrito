  if (acostado && ['collar', 'paliacate', 'patrio'].includes(a)) return;   // acostado no se le ve el cuello
  if (a === 'collar') {
    trazo([[70, cy + 26], [81, cy + 36]], 5, '#d7263d', false);
    elipse(80, cy + 39, 3, 3, '#f4c542', '#b8901c');
  } else if (a === 'paliacate' || a === 'patrio') {
    const tri = [[66, cy + 26], [89, cy + 35], [76, cy + 49]];
    ctx.save();
    ctx.beginPath(); ctx.moveTo(...tri[0]); ctx.lineTo(...tri[1]); ctx.lineTo(...tri[2]); ctx.closePath(); ctx.clip();
    if (a === 'patrio') {
      [['#006847', 62], ['#ffffff', 70], ['#ce1126', 78]].forEach(([col, x0]) => { ctx.fillStyle = col; ctx.fillRect(x0, cy + 20, 9, 32); });
    } else {
      ctx.fillStyle = '#c8102e'; ctx.fillRect(60, cy + 20, 34, 32);
      ctx.fillStyle = '#ffffff';
      [[72, cy + 31], [79, cy + 34], [75, cy + 40], [70, cy + 36]].forEach(([px, py]) => { ctx.beginPath(); ctx.arc(px, py, 1.3, 0, Math.PI * 2); ctx.fill(); });
    }
    ctx.restore();
    poligono(tri, 'rgba(0,0,0,0)', C.borde);
  } else if (a === 'navidad') {
    poligono([[71, cy + 4], [101, cy], [95, cy - 24]], '#d62828');
    trazo([[70, cy + 4], [102, cy]], 6, '#ffffff', false);
    elipse(95, cy - 24, 4, 4, '#ffffff', '#cccccc');
  } else if (a === 'bruja') {                                          // sombrero de bruja
    elipse(88, cy + 1, 22, 4.5, '#2b1d3a', '#120a1a');
    poligono([[76, cy], [100, cy - 2], [97, cy - 22], [106, cy - 32], [92, cy - 26]], '#2b1d3a', '#120a1a');
    poligono([[77, cy - 2], [99, cy - 4], [98.5, cy - 8], [78, cy - 6]], '#7b2cbf', null);
    ctx.fillStyle = '#ffd23f'; ctx.fillRect(86, cy - 7, 5, 4);
  } else if (a === 'calabaza') {                                       // tallito de calabaza en la cabeza
    trazo([[88, cy - 1], [90, cy - 9]], 4, '#4a7a2a', false);
    elipse(95, cy - 8, 5, 2.5, '#5f9e34', '#3d6b1f', -0.4);
  } else if (a === 'fiesta') {                                         // gorrito de fiesta
    poligono([[76, cy + 2], [98, cy - 1], [90, cy - 27]], '#ff4d9d', '#c2185b');
    ctx.save(); ctx.beginPath(); ctx.moveTo(76, cy + 2); ctx.lineTo(98, cy - 1); ctx.lineTo(90, cy - 27); ctx.closePath(); ctx.clip();
    ctx.fillStyle = '#ffd23f'; for (let k = 0; k < 4; k++) ctx.fillRect(70, cy - 24 + k * 7, 40, 2.5);
    ctx.restore();
    elipse(90, cy - 28, 3.5, 3.5, '#5bc0eb', '#2f8fb8');
  } else if (a === 'muertos') {
    [[73, cy + 5], [80, cy], [88, cy - 2], [96, cy], [102, cy + 4]].forEach(([px, py]) => {
      elipse(px, py, 5, 5, '#ff9f1c', '#e07b00');
      elipse(px, py, 1.8, 1.8, '#c1440e', null);
    });
  }
}

// =====================================================================
// 9) POSES
// =====================================================================
function pose() {
  const meneo = 0.3 + animo / 200;
  const colaAnimo = animo < 30 || hambre > 85 ? 'abajo' : 'arriba';
  const lengua = animo >= 30 || haceCalor();
  const de_pie = { cuerpo: [24, 48, 88, 80], cy: 22, patas: 'caminar', velPatas: 0.4, cola: colaAnimo, meneo,
                   ojos: 'abierto', lengua, oreja: 0.15 * Math.sin(frame * 0.4) };
  const sentado = { cuerpo: [35, 46, 84, 90], cy: 14, patas: 'sentado', cola: colaAnimo, meneo, ojos: 'abierto', lengua, oreja: 0 };
  const acostado = { cuerpo: [18, 66, 92, 94], cy: 58, patas: 'ninguna', cola: 'tendida', lengua: false };
  switch (estado) {
    case 'correr': case 'buscar': case 'traer':
      return { ...de_pie, cy: 20, velPatas: 0.8, meneo: 0.8, oreja: -0.3 + 0.2 * Math.sin(frame * 0.8), lengua: !tienePelota };
    case 'ir_comer': case 'ir_amigo': case 'ir_trepar':
      return { ...de_pie, velPatas: 0.55, meneo: 0.6 };
    case 'cola':    return { ...de_pie, velPatas: 0.9, meneo: 1, ojos: 'feliz' };
    case 'pasear': case 'seguir': case 'ir_beber': case 'ir_cama': case 'ir_jalar': case 'pedir_salir_ir': case 'salir':
      return { ...de_pie, velPatas: 0.5, meneo: 0.6 };
    case 'celos': case 'perseguir_laser': case 'esconderse':
      return { ...de_pie, cy: 20, velPatas: 0.85, meneo: 0.9, oreja: -0.3 + 0.2 * Math.sin(frame * 0.8) };
    case 'buscar_amiga': case 'olfatear':
      return { ...de_pie, cy: 34, velPatas: 0.35, meneo: 0.5, lengua: false, oreja: 0.4 };
    case 'pata':    return { ...sentado, patas: 'pata', ojos: 'feliz', meneo: 0.8 };
    case 'comer_galleta': return { ...sentado, galleta: frame % 30 < 22, ojos: 'feliz', lengua: false, meneo: 1 };
    case 'beber':   return { cuerpo: [24, 48, 88, 80], cy: 44, patas: 'quieto', cola: 'arriba', meneo: 0.7, ojos: 'cerrado', lengua: frame % 20 < 12, oreja: 0.5 };
    case 'roer':    return { cuerpo: [18, 66, 92, 94], cy: 48 + Math.sin(frame * 0.3) * 1.5, patas: 'ninguna', cola: 'tendida', ojos: 'feliz', lengua: false, oreja: 0.3, hueso: true };
    case 'jalar':   return { ...de_pie, cy: 26, patas: 'jalar', meneo: 1, ojos: 'feliz', lengua: false, oreja: -0.2, cuerda: true };
    case 'bano':    return { ...sentado, tina: true, sinPelos: true, ojos: frotado > 0 ? 'feliz' : 'abierto', meneo: 0.4, cola: 'abajo' };
    case 'sacudirse': return { ...de_pie, patas: 'quieto', ojos: 'cerrado', meneo: 2, sinPelos: true };
    case 'escondida': case 'pedir_salir': return { ...sentado, meneo: 0.2 };
    case 'rodar':   return { cuerpo: [18, 66, 92, 94], cy: 58, patas: 'ninguna', cola: 'tendida', ojos: 'feliz', lengua: true, oreja: 0.2 };
    case 'afuera':  return de_pie;
    case 'sentado': return sentado;
    case 'teclear': return { ...sentado, patas: 'teclear', meneo: 0.7, ojos: frame % 90 < 70 ? 'abierto' : 'feliz' };
    case 'rascar':  return { ...sentado, rascar: true, ojos: 'feliz', lengua: true };
    case 'comer':   return { cuerpo: [24, 48, 88, 80], cy: 44, patas: 'quieto', cola: 'arriba', meneo: 0.7,
                             ojos: frame % 40 < 20 ? 'cerrado' : 'feliz', lengua: false, oreja: 0.5 };
    case 'dormir':  return { ...acostado, ojos: 'cerrado', oreja: 0.2 };
    case 'acurrucado': return { ...acostado, cuerpo: [26, 64, 90, 94], ojos: 'abierto', oreja: 0.4 };
    case 'triste':  return { ...acostado, ojos: 'abierto', oreja: 0.5 };
    case 'aire':    return { ...de_pie, patas: 'aire', meneo: 0.6, ojos: 'feliz', oreja: -0.6, lengua: !tienePelota };
    case 'arrastrado': return { cuerpo: [35, 40, 84, 86], cy: 8, patas: 'colgando', cola: 'abajo', meneo: 0.3,
                               ojos: 'abierto', lengua: false, oreja: 0.3 * Math.sin(frame * 0.3) };
    case 'estirar': return { cuerpo: [22, 58, 86, 86], cy: 40, patas: 'estirar', cola: 'arriba', meneo: 0.2,
                             ojos: 'cerrado', lengua: false, oreja: 0.3 };
    default:        return de_pie;
  }
}

// =====================================================================
// 10) DIBUJAR AL PERRITO (se dibuja mirando a la derecha y se voltea)
// =====================================================================
function dibujarPerro(p) {
  const c = p.cuerpo, cy = p.cy;
  const gordura = 1 + Math.min(peso, 100) / 400;                        // las galletas se notan 🍪
  const bx = (c[0] + c[2]) / 2, by = (c[1] + c[3]) / 2;
  const brx = (c[2] - c[0]) / 2 * gordura, bry = (c[3] - c[1]) / 2 * (1 + (gordura - 1) / 2);
  const m = 8 * Math.sin(frame * p.meneo);

  // Cola (el schnauzer tiene colita corta)
  if (RAZA === 'schnauzer') {
    if (p.cola === 'tendida') trazo([[c[0] + 6, by + 2], [c[0] - 6, by + 6]], 6, C.pelo);
    else if (p.cola === 'abajo') trazo([[c[0] + 6, c[1] + 12], [c[0] - 4, c[1] + 22]], 6, C.pelo);
    else trazo([[c[0] + 6, c[1] + 10], [c[0] - 2 + m / 3, c[1] - 4], [c[0] - 3 + m / 2, c[1] - 12]], 6, C.pelo);
  } else {
    if (p.cola === 'tendida') trazo([[c[0] + 6, by + 4], [6, 92], [2, 86]], 6, C.pelo);
    else if (p.cola === 'abajo') trazo([[c[0] + 6, c[1] + 12], [10, c[1] + 30 + m / 3], [8, c[1] + 44]], 6, C.pelo);
    else trazo([[c[0] + 6, c[1] + 10], [8, c[1] - 4 + m], [4 + m / 2, c[1] - 18]], 6, C.pelo);
  }

  // Patas
  const patas = [34, 46, 66, 78];
  if (p.patas === 'caminar') patas.forEach((px, i) => {
    const paso = 5 * Math.sin(frame * p.velPatas + (i % 2) * Math.PI);
    trazo([[px, 72], [px + paso, 94]], 7, C.patas);
  });
  else if (p.patas === 'quieto') patas.forEach(px => trazo([[px, 72], [px, 94]], 7, C.patas));
  else if (p.patas === 'aire') patas.forEach(px => trazo([[px, 72], [px - 6, 90]], 7, C.patas));
  else if (p.patas === 'sentado') [58, 72].forEach(px => trazo([[px, 72], [px, 94]], 7, C.patas));
  else if (p.patas === 'teclear') [58, 72].forEach((px, i) => {
    const arriba = Math.floor(frame / 8) % 2 === i;          // patitas alternadas, como tecleando
    trazo([[px, 72], arriba ? [px + 7, 84] : [px, 94]], 7, C.patas);
  });
  else if (p.patas === 'colgando') [58, 72].forEach(px => trazo([[px, 72], [px, 100]], 7, C.patas));
  else if (p.patas === 'pata') {                                       // da la patita
    trazo([[58, 72], [58, 94]], 7, C.patas);
    trazo([[72, 72], [90 + Math.sin(frame * 0.2) * 2, 62]], 7, C.patas);
  }
  else if (p.patas === 'jalar') patas.forEach((px, i) => trazo([[px, 72], [px - 8, 94]], 7, C.patas));
  else if (p.patas === 'estirar') {
    trazo([[34, 76], [34, 94]], 7, C.patas); trazo([[46, 76], [46, 94]], 7, C.patas);
    trazo([[72, 78], [100, 94]], 7, C.patas); trazo([[80, 78], [110, 94]], 7, C.patas);
  }

  if (p.rascar) trazo([[46, 80], [70 + 4 * Math.sin(frame * 1.2), cy + 26]], 7, C.patas);

  // Cuerpo
  elipse(bx, by, brx, bry, C.pelo);
  recortarElipse(bx, by, brx - 1, bry - 1, () => {
    if (llueve()) {                                         // impermeable amarillo
      ctx.fillStyle = '#f6c90e'; ctx.fillRect(c[0], c[1], c[2] - c[0], c[3] - c[1]);
      ctx.fillStyle = '#d9a908'; ctx.fillRect(bx - 2, c[1], 3, c[3] - c[1]);
    } else if (haceFrio()) {                                // suéter a rayas
      ctx.fillStyle = '#2a6f97'; ctx.fillRect(c[0], c[1], c[2] - c[0], c[3] - c[1]);
      ctx.fillStyle = '#ffffff';
      for (let yy = c[1] + 6; yy < c[3]; yy += 10) ctx.fillRect(c[0], yy, c[2] - c[0], 3);
    } else if (accesorioActual() === 'calabaza') {          // disfraz de calabaza
      ctx.fillStyle = '#f28c28'; ctx.fillRect(c[0] - 20, c[1] - 10, c[2] - c[0] + 40, c[3] - c[1] + 20);
      ctx.strokeStyle = '#c4661a'; ctx.lineWidth = 2;
      for (let k = -2; k <= 2; k++) { ctx.beginPath(); ctx.ellipse(bx + k * 12, by, 6, bry, 0, 0, Math.PI * 2); ctx.stroke(); }
    } else {
      if (RAZA === 'schnauzer') {                           // pelo sal y pimienta
        ctx.fillStyle = C.manchas;
        for (let i = 0; i < 18; i++) {
          const px = c[0] + ((i * 23) % (c[2] - c[0])), py = c[1] + ((i * 13) % (c[3] - c[1]));
          ctx.beginPath(); ctx.arc(px, py, 1.6, 0, Math.PI * 2); ctx.fill();
        }
      }
      elipse(c[2] - 10, by + 6, 14, 17, C.pecho, null);    // pecho
    }
    // Lodo: más manchitas mientras más sucia está
    if (suciedad > 35) {
      const manchas = Math.min(6, Math.floor((suciedad - 35) / 11) + 1);
      ctx.fillStyle = 'rgba(110,75,40,0.88)';
      [[0.3, 0.4, 6, 4], [0.65, 0.7, 5, 3.5], [0.45, 0.8, 4, 3], [0.8, 0.35, 4.5, 3], [0.2, 0.75, 3.5, 3], [0.55, 0.25, 3, 2.5]]
        .slice(0, manchas).forEach(([fx, fy, rx, ry]) => {
          ctx.beginPath(); ctx.ellipse(bx - brx + fx * brx * 2, by - bry + fy * bry * 2, rx, ry, 0.3, 0, Math.PI * 2); ctx.fill();
        });
    }
  });
  // Despeinada si no la cepillas
  if (desalino > 60 && !p.sinPelos) {
    ctx.strokeStyle = C.pelo; ctx.lineWidth = 2; ctx.lineCap = 'round';
    for (let k = 0; k < 6; k++) {
      const px = bx - brx * 0.7 + k * brx * 0.28, py = by - bry + 1;
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + (k % 2 ? 3 : -3), py - 5 - (k % 3)); ctx.stroke();
    }
  }
  if (suciedad > 60 && ['caminar', 'sentado', 'aire'].includes(estado) && frame % 120 < 4) {
    brillos.push({ x: OX + 60 + Math.random() * 40, y: OY + 30, vida: 40, mosca: true });   // una mosquita 🪰
  }

  // Cabeza
  if (RAZA === 'schnauzer') dibujarCabezaSchnauzer(p, cy);
  else dibujarCabezaLabrador(p, cy);

  // Capucha del impermeable o accesorio
  if (llueve()) {
    ctx.beginPath(); ctx.ellipse(86, cy + 10, 20, 15, 0, Math.PI, Math.PI * 2); ctx.closePath();
    ctx.fillStyle = '#f6c90e'; ctx.fill(); ctx.strokeStyle = '#b88c06'; ctx.lineWidth = 1.5; ctx.stroke();
  } else dibujarAccesorio(cy);

  // Lo que trae en el hocico
  if (p.hueso) {
    trazo([[100, cy + 31], [122, cy + 31]], 5, '#f5f0e1', false);
    [[99, cy + 28], [99, cy + 34], [123, cy + 28], [123, cy + 34]].forEach(([hx, hy]) => elipse(hx, hy, 3.5, 3.5, '#f5f0e1', '#c9bfa5'));
  }
  if (p.galleta) {
    elipse(112, cy + 31, 6, 6, '#c68642', '#8b5a2b');
    [[110, cy + 29], [114, cy + 33]].forEach(([gx, gy]) => elipse(gx, gy, 1.2, 1.2, '#4e2a12', null));
  }
  if (p.cuerda) trazo([[110, cy + 31], [124, cy + 33]], 4, '#e63946', false);
  if (p.tina) {                                                         // tina de baño
    ctx.save(); ctx.globalAlpha = 0.95;
    poligono([[22, 70], [112, 70], [104, 98], [30, 98]], '#e9f4fb', '#8fb8d1');
    elipse(67, 70, 46, 6, '#cfe8f7', '#8fb8d1');
    ctx.restore();
  }

  // Pelota en el hocico
  if (tienePelota) {
    elipse(113, cy + 30, 8, 8, '#d4ec4a', '#8fa51f');
    ctx.beginPath(); ctx.arc(106, cy + 30, 6, -0.9, 0.9); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
  }
}

function dibujarOjo(p, ex, ey, rx, ry) {
  const parpadea = frame % 150 < 6;
  if (p.ojos === 'x') {
    trazo([[ex - 3, ey - 3], [ex + 3, ey + 3]], 2, '#bbbbbb', false);
    trazo([[ex - 3, ey + 3], [ex + 3, ey - 3]], 2, '#bbbbbb', false);
    return;
  }
  if (p.ojos === 'cerrado' || (p.ojos === 'abierto' && parpadea)) trazo([[ex - 4, ey], [ex + 4, ey]], 2, '#8a8a8a', false);
  else if (p.ojos === 'feliz') ojosFelices(ex, ey);
  else {
    if (RAZA === 'labrador') elipse(ex, ey, 4, 4.5, '#f2f2f2', null);
    elipse(ex + 1, ey, rx, ry, C.ojo, null);
    elipse(ex + 2, ey - 1.5, 1, 1, '#ffffff', null);
  }
}

function dibujarCabezaLabrador(p, cy) {
  elipse(86, cy + 17, 18, 17, C.pelo);
  elipse(104, cy + 24, 12, 8, C.pelo);
  elipse(114, cy + 21, 4, 3.2, '#000', null);
  elipse(113, cy + 20, 1.2, 1, '#ffffff', null);
  if (p.lengua && !tienePelota) {
    const j = 1.5 * Math.sin(frame * 0.3);
    elipse(104, cy + 34 + j, 3.5, 5 + j / 2, COMUN.lengua, COMUN.lenguaBorde);
  }
  dibujarOjo(p, 92, cy + 13, 2.8, 3.2);
  elipse(76, cy + 14, 6.5, 14, C.oreja, C.borde, 0.35 + p.oreja);
}

function dibujarCabezaSchnauzer(p, cy) {
  elipse(86, cy + 16, 16, 15, C.pelo);
  elipse(104, cy + 22, 13, 7, C.pelo);
  if (p.lengua && !tienePelota) {
    const j = 1.2 * Math.sin(frame * 0.3);
    elipse(106, cy + 38 + j, 3, 4, COMUN.lengua, COMUN.lenguaBorde);
  }
  const esponjada = desalino > 60 ? 5 : 0;
  poligono([[93, cy + 24], [117 + esponjada / 2, cy + 24], [115 + esponjada, cy + 36], [104, cy + 40 + esponjada], [93 - esponjada / 2, cy + 35]], C.claro);   // barba
  elipse(116, cy + 19, 3.8, 3, '#000', null);
  dibujarOjo(p, 92, cy + 13, 2.4, 2.6);
  poligono([[85, cy + 9], [101, cy + 6], [98, cy + 12]], C.claro);                                   // cejas
  ctx.save();                                                                                         // oreja doblada
  ctx.translate(84, cy + 4); ctx.rotate(p.oreja * 0.6);
  poligono([[-8, 0], [4, -8], [6, 6]], C.oreja);
  ctx.restore();
}

function dibujarPanza(muertita = false) {
  const w = muertita ? 0 : 6 * Math.sin(frame * 0.5);
  [[36, -1], [48, 1], [66, -1], [78, 1]].forEach(([px, s]) => trazo([[px, 72], [px + s * w * 0.6, 52]], 7, C.patas));
  trazo([[26, 86], [RAZA === 'schnauzer' ? 16 : 8, 90 + w / 2], [RAZA === 'schnauzer' ? 14 : 2, 84]], 6, C.pelo);
  elipse(57, 81, 33, 13, C.pelo);
  recortarElipse(57, 81, 32, 12, () => elipse(62, 72, 24, 9, C.pecho, null));
  elipse(97, 80, 16, 14, C.pelo);
  elipse(108, 68, 7, 10, C.pelo, C.borde, 0.5);
  if (RAZA === 'schnauzer') poligono([[102, 66], [116, 60], [118, 74], [108, 78]], C.claro);
  elipse(112, 60, 3.2, 4, '#000', null);
  elipse(117, 76, 3, 5, COMUN.lengua, COMUN.lenguaBorde, 0.6);
  if (muertita) {
    trazo([[95, 73], [101, 79]], 2, '#bbbbbb', false); trazo([[95, 79], [101, 73]], 2, '#bbbbbb', false);
  } else ojosFelices(98, 76);
  elipse(86, 90, 12, 5, C.oreja, C.borde, 0.1);
}

function dibujarBocadillo() {
  cajaBocadillo = null;
  if (!bocadillo) return;
  if (Date.now() > bocadillo.hasta) { bocadillo = null; return; }
  ctx.font = '13px "Segoe UI", sans-serif';
  const palabras = bocadillo.texto.split(/\s+/);
  let lineas = [], l = '';
  for (const pal of palabras) {
    const prueba = l ? l + ' ' + pal : pal;
    if (ctx.measureText(prueba).width > 230 && l) { lineas.push(l); l = pal; } else l = prueba;
  }
  if (l) lineas.push(l);
  if (lineas.length > 6) { lineas = lineas.slice(0, 6); lineas[5] += '…'; }
  const ancho = Math.max(...lineas.map(t => ctx.measureText(t).width)) + 20;
  const pista = bocadillo.accion === 'galleta' ? 'clic para darle galleta 🍪'
              : bocadillo.accion === 'salir' ? 'clic para sacarla 🚪'
              : bocadillo.accion === 'pasear' ? 'clic para salir a pasear 🐾'
              : bocadillo.accion === 'comida' ? 'clic para servirnos también 🍖'
              : bocadillo.fijo ? 'clic para cerrar' : null;
  const alto = lineas.length * 17 + 14 + (pista ? 12 : 0);
  const cx = spritesListos() ? 150 + dir * 25 : OX + 70 + (dir === 1 ? 10 : -10);
  const bx = Math.min(Math.max(cx - ancho / 2, 4), W - ancho - 4);
  const tope = spritesListos() && llueve() && sombrillaZona ? sombrillaZona.y - 6 : cajaPerro.y1 - (spritesListos() ? 30 : 0);
  const by = Math.max(2, Math.min(OY + 20, tope) - alto - 10);
  ctx.beginPath(); ctx.roundRect(bx, by, ancho, alto, 10);
  ctx.moveTo(cx - 6, by + alto); ctx.lineTo(cx, by + alto + 9); ctx.lineTo(cx + 6, by + alto);
  ctx.fillStyle = '#ffffff'; ctx.fill();
  ctx.strokeStyle = '#4a4a4a'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#222';
  lineas.forEach((t, i) => ctx.fillText(t, bx + 10, by + 20 + i * 17));
  if (pista) {
    ctx.fillStyle = bocadillo.accion ? '#9a5a2b' : '#888'; ctx.font = '10px "Segoe UI", sans-serif';
    ctx.fillText(pista, bx + 10, by + alto - 7);
  }
  cajaBocadillo = { x: bx, y: by, w: ancho, h: alto };
}

function dibujar() {
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.globalAlpha = opacidad;
  ctx.translate(OX + 10, OY + 20);
  if (enCama && estado === 'dormir') ctx.translate(0, -12);           // arriba del cojín
  let d = dir;
  if (estado === 'cola') {
    d = Math.floor(frame / 40) % 2 ? 1 : -1;
    ctx.translate(0, -Math.abs(Math.sin(frame * 0.3)) * 6);
  }
  if (estado === 'rodar') { ctx.translate(60, 80); ctx.rotate((frame * 0.12) % (Math.PI * 2)); ctx.translate(-60, -80); }
  if (estado === 'sacudirse') { ctx.translate(60, 94); ctx.rotate(Math.sin(frame * 1.1) * 0.12); ctx.translate(-60, -94); }
  if (d === -1) { ctx.translate(120, 0); ctx.scale(-1, 1); }
  if (RAZA === 'schnauzer') { ctx.translate(60, 94); ctx.scale(0.85, 0.85); ctx.translate(-60, -94); }   // es más chiquito
  if (spritesListos()) { ctx.restore(); dibujarConTransicion(); }
  else {
    if (estado === 'panza') dibujarPanza();
    else if (estado === 'muertita') dibujarPanza(true);
    else dibujarPerro(pose());
    ctx.restore();
    cajaPerro = { x1: OX + 10, x2: OX + 132, y1: OY + 15, y2: OY + 118 }; bocaVentana = null;
  }

  // Cuerda: del hocico hasta el centro (la otra mitad la dibuja su amiga)
  if (estado === 'jalar' && cuerdaJuego && bocaVentana) dibujarCuerda();
  // Espuma del baño, gotas, brillos y mosquitas
  espuma.forEach(e => { elipse(e.x, e.y, e.r, e.r, 'rgba(255,255,255,0.92)', 'rgba(190,220,240,0.9)'); });
  gotas.forEach(g => { ctx.fillStyle = 'rgba(120,180,255,0.8)'; ctx.beginPath(); ctx.ellipse(g.x, g.y, 1.8, 3, 0, 0, Math.PI * 2); ctx.fill(); });
  brillos.forEach(b => {
    ctx.save(); ctx.globalAlpha = b.vida / 40;
    if (b.mosca) { ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(b.x + Math.sin(b.vida * 0.6) * 6, b.y + Math.cos(b.vida * 0.4) * 4, 1.6, 0, Math.PI * 2); ctx.fill(); }
    else { ctx.fillStyle = '#ffe066'; ctx.font = '12px sans-serif'; ctx.fillText('✦', b.x, b.y); }
    ctx.restore();
  });
  confeti.forEach(c => { ctx.fillStyle = c.color; ctx.fillRect(c.x, c.y, 4, 2); });
  dibujarMariposa();
  // Temporada: hojitas, nieve o pétalos cerca de ellas
  particulas.forEach(q => {
    ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.giro);
    if (q.tipo === 'hoja') { ctx.fillStyle = q.color; ctx.beginPath(); ctx.ellipse(0, 0, 4, 2, 0, 0, Math.PI * 2); ctx.fill(); }
    else if (q.tipo === 'nieve') { ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.beginPath(); ctx.arc(0, 0, 2, 0, Math.PI * 2); ctx.fill(); }
    else { ctx.fillStyle = '#ffb3c6'; ctx.beginPath(); ctx.ellipse(0, 0, 3, 1.6, 0, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
  });
  if (fantasma) {                                         // fantasmita de Halloween 👻
    ctx.save(); ctx.globalAlpha = Math.min(1, fantasma.vida / 60) * 0.85;
    ctx.font = '22px sans-serif'; ctx.fillText('👻', fantasma.x, fantasma.y + Math.sin(frame * 0.08) * 4);
    ctx.restore();
  }

  if (llueve()) {                                         // gotitas alrededor (la sombrilla las tapa)
    ctx.strokeStyle = 'rgba(140,185,255,0.55)'; ctx.lineWidth = 1.5;
    for (let i = 0; i < 14; i++) {
      const gx = 40 + ((i * 53) % 220), gy = 20 + ((frame * 3 + i * 37) % (H - 30));
      const z = spritesListos() && sombrillaZona;
      if (z && gx > z.x1 && gx < z.x2 && gy > z.y) continue;
      ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx - 2, gy + 7); ctx.stroke();
    }
  }
  if (estado === 'dormir') {
    const z = Math.floor(frame / 25) % 3;
    ctx.fillStyle = COMUN.z; ctx.font = `bold ${11 + z * 3}px sans-serif`;
    const zx = spritesListos() ? 150 + dir * 70 : OX + (dir === 1 ? 118 : 24), zy = spritesListos() ? cajaPerro.y1 - 4 : OY + 80;
    ctx.fillText('z'.repeat(z + 1), zx, zy - z * 9);
  }
  corazones.forEach(h => corazon(h.x, h.y, 7, h.vida / 60));

  if (pomodoro && !bocadillo && PRINCIPAL) {
    const s = Math.ceil(pomodoro.restante / 1000);
    const txt = `${pomodoro.fase === 'trabajo' ? '🍅' : '☕'} ${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
    ctx.font = 'bold 12px "Segoe UI", sans-serif'; ctx.textAlign = 'center';
    ctx.lineWidth = 3; ctx.strokeStyle = '#1c1c1c'; ctx.strokeText(txt, OX + 70, OY + 18);
    ctx.fillStyle = '#ffffff'; ctx.fillText(txt, OX + 70, OY + 18);
    ctx.textAlign = 'start';
  }
  dibujarBocadillo();
}

// =====================================================================
// 11) MOUSE
// =====================================================================
function sobrePelota(px, py) {                  // coordenadas locales de esta ventana
  if (!pelota || pelota.portador) return false;
  const dx = pelota.x - (x + px), dy = pelota.y - (y + py);
  return dx * dx + dy * dy < 28 * 28;
}
function sobreMascota(px, py) {
  if (opacidad < 0.3) return false;            // salió al baño
  if (sobrePelota(px, py)) return false;        // deja que agarres la pelota aunque esté junto al perrito
  if (px >= cajaPerro.x1 && px <= cajaPerro.x2 && py >= cajaPerro.y1 && py <= cajaPerro.y2) return true;
  const b = cajaBocadillo;
  return !!(b && px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h + 9);
}
function revisarPuntero(px, py) {
  const sobre = !!arrastre || sobreMascota(px, py);
  if (sobre && ignorando) { ignorando = false; window.mascota.ignorar(false); }
  else if (!sobre && !ignorando) { ignorando = true; window.mascota.ignorar(true); }
}
window.addEventListener('mousemove', e => {
  revisarPuntero(e.clientX, e.clientY);
  const enPerrito = e.clientX >= cajaPerro.x1 && e.clientX <= cajaPerro.x2 && e.clientY >= cajaPerro.y1 && e.clientY <= cajaPerro.y2;
  const antes = ultimoMouse; ultimoMouse = { x: e.clientX, y: e.clientY };
  if (!enPerrito || !antes || arrastre) return;
  const dist = Math.hypot(e.clientX - antes.x, e.clientY - antes.y);
  if (dist > 60) return;
  if (estado === 'bano') {                                // tallar con espuma
    frotado += dist;
    if (dist > 2 && espuma.length < 70)
      espuma.push({ x: e.clientX + (Math.random() - 0.5) * 12, y: e.clientY + (Math.random() - 0.5) * 12, r: 3 + Math.random() * 4 });
  } else if (!ocupada() && estado !== 'dormir') {         // cepillar
    cepillado += dist;
    if (dist > 3 && Math.random() < 0.15) brillos.push({ x: e.clientX, y: e.clientY, vida: 30 });
    if (cepillado > 1800) {
      cepillado = 0; desalino = 0;
      window.mascota.evento({ tipo: 'cepillada' });
      animo = Math.min(100, animo + 8);
      if (Date.now() - ultimoCepillado > 2 * 60e3) { ultimoCepillado = Date.now(); decir(azar(['¡Qué rico! ✨', 'Mmm, qué buen cepillado 😌', '¡Quedé bien bonita! ✨']), 2500); }
    }
  }
});
document.addEventListener('mouseleave', () => { if (!arrastre) revisarPuntero(-1, -1); });

canvas.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  const b = cajaBocadillo;
  if (b && e.clientX >= b.x && e.clientX <= b.x + b.w && e.clientY >= b.y && e.clientY <= b.y + b.h) {
    const accion = bocadillo && bocadillo.accion;
    bocadillo = null;
    if (accion === 'galleta') darGalleta();
    else if (accion === 'pasear') window.mascota.pedirPasear();
    else if (accion === 'comida') window.mascota.pedirComida();
    else if (accion === 'salir') salirAlBano();
    return;
  }
  if (['bano', 'sacudirse', 'salir', 'afuera'].includes(estado)) return;
  canvas.setPointerCapture(e.pointerId);
  arrastre = { dx: e.screenX - x, dy: e.screenY - y, sx: e.screenX, sy: e.screenY, movio: false };
});
canvas.addEventListener('pointermove', e => {
  if (!arrastre) return;
  if (Math.abs(e.screenX - arrastre.sx) + Math.abs(e.screenY - arrastre.sy) > 4) {
    if (!arrastre.movio && tienePelota) soltarPelota(false);
    arrastre.movio = true;
  }
  if (arrastre.movio) { estado = 'arrastrado'; x = e.screenX - arrastre.dx; y = e.screenY - arrastre.dy; }
});
canvas.addEventListener('pointerup', () => {
  if (!arrastre) return;
  const movio = arrastre.movio;
  arrastre = null;
  if (movio) { estado = 'aire'; vy = 0; vxAire = 0; soloPiso = false; return; }
  if (clicPendiente) {                                  // doble clic = chat
    clearTimeout(clicPendiente); clicPendiente = null;
    dormidoPorInactividad = false;
    cambiar('sentado', seg(6));
    decir(PRINCIPAL ? '¿Platicamos? 🐶' : `Te paso con ${config.nombre} 🐶`, 2500);
    window.mascota.abrirPanel('chat');
    return;
  }
  clicPendiente = setTimeout(() => { clicPendiente = null; caricia(); }, 280);
});
function caricia() {
  const eraPanza = estado === 'panza';
  window.mascota.evento({ tipo: 'caricia' });
  if (cumple) lanzarConfeti(15);
  enCama = false;
  animo = Math.min(100, animo + 12);
  dormidoPorInactividad = false;
  vy = -10 - animo / 10; vxAire = 3 * dir * VELOCIDAD;
  lanzarCorazones(eraPanza ? 6 : 3);
  if (Math.random() < 0.5) ladrar(1);
  if (eraPanza) decir('¡Más, más! 🥰', 2500);
  estado = 'aire';
}
canvas.addEventListener('contextmenu', e => { e.preventDefault(); window.mascota.menu(); });

// =====================================================================
// 12) MENSAJES DEL PROCESO PRINCIPAL
// =====================================================================
const m = window.mascota;
m.on('tick', d => {
  if (cursorAntes && Math.abs(d.cursor.x - cursorAntes.x) + Math.abs(d.cursor.y - cursorAntes.y) > 2)
    cursorMovidoHasta = Date.now() + 1500;
  cursorAntes = cursor = d.cursor;
  if (!arrastre) revisarPuntero(cursor.x - x, cursor.y - y);

  repisas = d.repisas || [];
  otros = d.otros || [];
  pelota = d.pelota;
  if (!pelota) tienePelota = false;
  plato = d.plato;
  if (!plato) yaComio = false;
  hambre = d.hambre;
  escribiendo = d.escribiendo;
  sed = d.sed; suciedad = d.suciedad; desalino = d.desalino; peso = d.peso;
  necesidad = d.necesidad && !['salir', 'afuera'].includes(estado);
  cumple = d.cumple; cumpleAmiga = d.cumpleAmiga; favorito = d.favorito;
  agua = d.agua; cama = d.cama; laser = d.laser; charco = d.charco;

  idle = d.idle;
  if (idle >= config.inactividadMin * 60 && !dormidoPorInactividad && !trabajando() && estado !== 'arrastrado') {
    dormidoPorInactividad = true;
    if (tienePelota) soltarPelota(false);
    if (estado !== 'aire') cambiar('dormir', 1e9);
  }
  if (dormidoPorInactividad && idle < 2) {
    dormidoPorInactividad = false;
    saludar('');                                                    // el saludo con palabras llega con la bienvenida
  }
});
m.on('pantallas', p => { displays = p; });
m.on('truco', hacerTruco);
m.on('galleta', darGalleta);
m.on('hueso', darHueso);
m.on('banar', empezarBano);
m.on('salir', salirAlBano);
m.on('pasear', p => { prepararAccion(); paseo = { ...p, fase: 0 }; if (!ocupada()) cambiar('pasear', 1e9); });
m.on('seguir', quien => { prepararAccion(); siguiendoA = quien; if (!ocupada()) cambiar('seguir', 1e9); });
m.on('cuerda', d => { prepararAccion(); cuerdaJuego = { ...d, lado: centroX() < d.medio ? 1 : -1 }; if (!ocupada()) cambiar('ir_jalar', seg(20)); });
m.on('escondidas', d => {
  prepararAccion();
  escondite = { ...d, limite: Date.now() + 45000, olfatearHasta: Date.now() + 9000 };
  if (d.rol === 'buscar') { decir('¡Voy a contar! 1, 2, 3… 🙈', 3500); if (!ocupada()) cambiar('buscar_amiga', 1e9); }
  else if (!ocupada()) cambiar('esconderse', 1e9);
});
m.on('fin-actividad', () => {
  siguiendoA = null;
  if (estado === 'buscar_amiga') { escondite = null; cambiar('sentado', seg(3)); }
  if (estado === 'seguir') cambiar('sentado', seg(3));
  if (estado === 'escondida' || estado === 'esconderse') {
    escondite = null; decir('¡Me encontraste! 🙈', 2500); brincar(9); lanzarCorazones(3);
  }
});
m.on('bienvenida', d => {
  if (trabajando() || estado === 'arrastrado') return;
  dormidoPorInactividad = false; enCama = false;
  const min = d.min;
  if (min >= 480) {                                                   // más de 8 horas: ¡fiesta!
    if (PRINCIPAL) decir(azar(['¡Te extrañé muchísimo! 🥺💕', '¡Por fin llegaste! 🥺💕']), 6000);
    else setTimeout(() => decir('¡Wuf wuf! 💕', 3000), 1200);
    ladrar(3, true); lanzarCorazones(8); brincar(14); setTimeout(() => brincar(12), 900);
  } else if (min >= 60) {
    if (PRINCIPAL) decir(azar(['¡Volviste! 🐾 Te estábamos esperando', '¡Ya llegaste! 🐾']), 5000);
    ladrar(2, true); lanzarCorazones(4); brincar(11);
  } else {
    if (PRINCIPAL) decir(azar(['¡Hola de nuevo! 🐾', '¡Ahí estás! 🐾']), 3000);
    cambiar('cola', seg(2));
  }
  if (PRINCIPAL && d.nota) setTimeout(() => decir(d.nota, 0, true), min >= 480 ? 6500 : 5000);   // lo que hicieron
});
m.on('a-la-cama', () => {
  if (!INTERRUMPIBLE.includes(estado) || trabajando() || estado === 'dormir') return;
  if (enRepisa()) { bajarAlPiso(); return; }
  cambiar('ir_cama', seg(30));
});
m.on('regalo-recibido', () => {
  if (bocadillo && bocadillo.fijo) bocadillo = null;
  decir(azar(['¡Te gustó! 💕', '¡De nada! 💕', '¡Sabía que te iba a gustar! 🐾']), 3000);
  lanzarCorazones(6); ladrar(1); if (!ocupada()) brincar(10);
});
m.on('pedir-paseo', () => {
  if (ocupada() || trabajando()) return;
  dormidoPorInactividad = false;
  decir(azar(['¡Buenos días! ¿Salimos a caminar? 🐾', '¡Qué bonita mañana! ¿Vamos a pasear? ☀️']), 0, true, 'pasear');
  ladrar(2); brincar(9); cambiar('sentado', seg(30));
});
m.on('hora-comida', d => {
  if (ocupada() || trabajando()) return;
  dormidoPorInactividad = false;
  const quien = d && d.dueno ? `, ${d.dueno}` : '';
  if (PRINCIPAL) decir(`¡Hora de comer${quien}! 🍽️ Buen provecho`, 0, true, 'comida');
  else setTimeout(() => decir('¡Comida! 🍖', 3000), 1500);
  ladrar(2); lanzarConfeti(20); cambiar('celebrar', seg(4));
});
m.on('celos', () => { if (INTERRUMPIBLE.includes(estado) && !trabajando()) cambiar('celos', seg(10)); });
m.on('config', c => { config = c; });
m.on('clima', c => { clima = c; });
m.on('dormir', () => cambiar('dormir', seg(60)));
m.on('despedida', () => decir('¡Adiós! 👋', 2000));
m.on('te-invitan', () => {
  if (!['caminar', 'sentado', 'rascar', 'cola', 'triste', 'estirar', 'panza'].includes(estado) || trabajando()) return;
  const amigo = otros[0];
  if (amigo) voltear(amigo.x > x ? 1 : -1, true);
  brincar(9); lanzarCorazones(3); animo = Math.min(100, animo + 5);
});
m.on('aviso', a => {
  decir(a.texto, a.ms || 5000, !!a.fijo);
  if (a.ladrar) ladrar(2, true);
  if (estado === 'dormir' && a.fijo && !trabajando()) { dormidoPorInactividad = false; cambiar('sentado', seg(5)); }
});
m.on('reaccion', r => {
  decir(r.texto, 9000);
  animo = Math.min(100, animo + 3);
  if (estado !== 'aire' && estado !== 'arrastrado') cambiar('sentado', seg(6));
});
m.on('pomodoro', p => {
  pomodoro = p;
  if (trabajando() && !['dormir', 'aire', 'arrastrado'].includes(estado)) {
    if (tienePelota) soltarPelota(false);
    cambiar('dormir', seg(10));
  }
  if (p && p.fase === 'descanso' && estado === 'dormir') cambiar('cola', seg(3));
});

// =====================================================================
// 13) ARRANQUE
// =====================================================================
Promise.all([m.pantallas(), m.config(), m.clima()]).then(([p, c, cl]) => {
  displays = p; config = c; clima = cl;
  x = window.screenX;
  const d = pantallaEn(x + OX + 70) || p[0];
  y = d.y + d.height - H;
  decir(PRINCIPAL ? `¡Hola! Soy ${config.nombre} 🐶` : `¡Hola! Soy ${config.nombreAmigo} 🐾`, 4000);
  requestAnimationFrame(actualizar);
});
</script>
